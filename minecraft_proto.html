const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('mcproto',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});

async function findDir(h,name,depth){if(h.name==name)return h;try{return await h.getDirectoryHandle(name)}catch(e){}

async function img(name){if(imgs[name])return imgs[name];const f=await getF('textures/'+name+'.png');if(!f)return null;
 const b=await createImageBitmap(f),c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.imageSmoothingEnabled=false;

const tint=(c,col)=>{const o=document.createElement('canvas');o.width=o.height=16;const x=o.getContext('2d');x.drawImage(c,0,0);

 else if(key.endsWith('|w'))c=tint(imgs[key.slice(0,-2)],'#3f76e4');else if(key.endsWith('|g'))c=tint(imgs[key.slice(0,-2)],GRASS);else if(key.endsWith('|f'))c=tint(imgs[key.slice(0,-2)],FOLIAGE);else c=imgs[key];
