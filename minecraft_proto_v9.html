function calcDoorHinge(px,py,pz,facing){
 const leftDir={north:[-1,0],south:[1,0],east:[0,-1],west:[0,1]}[facing]||[-1,0];
 const rightDir=[-leftDir[0],-leftDir[1]];
 const lx=px+leftDir[0],lz=pz+leftDir[1],rx=px+rightDir[0],rz=pz+rightDir[1];
 const lb0=id(lx,py,lz),lb1=id(lx,py+1,lz),rb0=id(rx,py,rz),rb1=id(rx,py+1,rz);
 const lDoor=(lb0&&isDoorName(B[lb0].n))||(lb1&&isDoorName(B[lb1].n));
 const rDoor=(rb0&&isDoorName(B[rb0].n))||(rb1&&isDoorName(B[rb1].n));
 if(lDoor&&!rDoor)return 'right';
 if(rDoor&&!lDoor)return 'left';
 const lScore=(opq(lb0)?1:0)+(opq(lb1)?1:0);
 const rScore=(opq(rb0)?1:0)+(opq(rb1)?1:0);
 return lScore>rScore?'right':'left';
}

 if(n=='iron_door'||n=='iron_trapdoor')return false;
 const pr=getBlockPropsAt(x,y,z);if(!pr)return false;
 const nextOpen=pr.open==='true'?'false':'true';
 const np=Object.assign({},pr,{open:nextOpen});
 if(isGateName(n)&&nextOpen==='true'){
  const look=LOOKS[Math.floor((((P.yaw%360)+360)%360+45)/90)%4];
  if((pr.facing=='north'||pr.facing=='south')&&(look=='north'||look=='south'))np.facing=look;
  if((pr.facing=='east'||pr.facing=='west')&&(look=='east'||look=='west'))np.facing=look;
 }
 await setBlockPropsAt(x,y,z,np,true);
 if(isDoorName(n)){
  const oy=pr.half==='upper'?y-1:y+1;
  if(oy>=0&&oy<H&&id(x,oy,z)==b){
   const opr=getBlockPropsAt(x,oy,z);
   if(opr)await setBlockPropsAt(x,oy,z,Object.assign({},opr,{open:nextOpen}),true);
  }
 }
 const isCopper=/^copper_|^exposed_copper_|^weathered_copper_|^oxidized_copper_|^waxed_/.test(n);
 const act=nextOpen==='true'?'open':'close';
 const snd=isDoorName(n)?(isCopper?'block.copper_door.'+act:'block.wooden_door.'+act)
  :isTrapdoorName(n)?(isCopper?'block.copper_trapdoor.'+act:'block.wooden_trapdoor.'+act)
  :'block.fence_gate.'+act;
 playSound(snd,1,.9+Math.random()*.1);
 swing=1;swingK='place';
 return true;
}

// ---- ④ 音符ブロック（Note Block） ----
const NOTE_PARTS=[];
function noteInstrument(x,y,z){
 const bb=y>0?id(x,y-1,z):0;
 if(!bb)return 'block.note_block.harp';
 const n=B[bb].n;
 if(n=='hay_block')return 'block.note_block.banjo';
 if(n=='bone_block')return 'block.note_block.xylophone';
 if(n=='iron_block')return 'block.note_block.iron_xylophone';
 if(n=='gold_block')return 'block.note_block.bell';
 if(n=='emerald_block')return 'block.note_block.bit';
 if(n=='clay')return 'block.note_block.flute';
 if(n=='packed_ice')return 'block.note_block.chime';
 if(/wool|carpet/.test(n))return 'block.note_block.guitar';
 if(n=='soul_sand'||n=='soul_soil')return 'block.note_block.cow_bell';
 if(/pumpkin|jack_o_lantern/.test(n))return 'block.note_block.didgeridoo';
 if(n=='glowstone')return 'block.note_block.pling';
 const sc=SCAT(n);
 if(sc=='wood')return 'block.note_block.bass';
 if(sc=='stone')return 'block.note_block.basedrum';
 if(sc=='sand'||sc=='gravel')return 'block.note_block.snare';
 if(sc=='glass')return 'block.note_block.hat';
 return 'block.note_block.harp';
}

function playNoteBlock(x,y,z,increment){
 let be=getBE(x,y,z);
 if(!be||be.type!=='note_block'){be={type:'note_block',note:0};setBE(x,y,z,be)}
 if(increment)be.note=(be.note+1)%25;
 if(y+1<H&&id(x,y+1,z)!==0)return;
 const inst=noteInstrument(x,y,z);
 const pitch=Math.pow(2,(be.note-12)/12);
 playSound(inst,3,pitch);
 // 音符パーティクル（25音階の色相変化）
 const cv=document.createElement('canvas');cv.width=cv.height=16;
 const cx=cv.getContext('2d');
 const hue=Math.round((be.note/24)*300);
 cx.fillStyle='hsl('+hue+',100%,55%)';
 cx.fillRect(6,2,2,10);cx.fillRect(6,2,5,2);cx.fillRect(3,9,5,5);
 const tx=new THREE.CanvasTexture(cv);tx.magFilter=tx.minFilter=THREE.NearestFilter;tx.generateMipmaps=false;
 const m=new THREE.Mesh(new THREE.PlaneGeometry(.35,.35),new THREE.MeshBasicMaterial({map:tx,transparent:true,depthWrite:false,side:THREE.DoubleSide}));
 m.position.set(x+.5,y+1.25,z+.5);scene.add(m);
 NOTE_PARTS.push({m,tx,vy:.04,age:0,life:20});
}

function notePartTick(){
 for(let i=NOTE_PARTS.length-1;i>=0;i--){
  const p=NOTE_PARTS[i];p.age++;
  p.m.position.y+=p.vy;p.vy*=.92;
  p.m.quaternion.copy(cam.quaternion);
  if(p.age>=p.life){scene.remove(p.m);p.m.geometry.dispose();p.tx.dispose();NOTE_PARTS.splice(i,1)}
 }
}

const FUEL_TAG_LIST=[['planks',300],['logs_that_burn',300],['wooden_slabs',150],['wooden_stairs',300],['wooden_fences',300],['fence_gates',300],['wooden_doors',200],['wooden_trapdoors',300],['wooden_pressure_plates',300],['wooden_buttons',100],['saplings',100],['wool',100],['wool_carpets',67],['banners',300],['boats',1200],['signs',200]];

async function initFuelTags(){
 for(const [tag] of FUEL_TAG_LIST){FUEL_TAGS[tag]=await itemTag(tag)}
}

function getFuelTime(slot){
 if(!slot)return 0;
 const nm=slotName(slot);if(!nm)return 0;
 if(FUEL_ITEMS[nm])return FUEL_ITEMS[nm];
 for(const [tag,tm] of FUEL_TAG_LIST){if(FUEL_TAGS[tag]&&FUEL_TAGS[tag].has(nm))return tm}
 if(/_planks$|_log$|_wood$|_stem$|_hyphae$/.test(nm)&&!/crimson|warped/.test(nm))return 300;
 if(/_slab$/.test(nm)&&/oak|spruce|birch|jungle|acacia|dark_oak|mangrove|cherry|bamboo/.test(nm))return 150;
 if(/_stairs$|_fence$|_fence_gate$|_trapdoor$|_boat$/.test(nm)&&/oak|spruce|birch|jungle|acacia|dark_oak|mangrove|cherry|bamboo/.test(nm))return 300;
 if(/_door$/.test(nm)&&/oak|spruce|birch|jungle|acacia|dark_oak|mangrove|cherry|bamboo/.test(nm))return 200;
 if(/_sapling$/.test(nm))return 100;
 if(/_wool$/.test(nm))return 100;
 if(/_carpet$/.test(nm))return 67;
 return 0;
}

function findSmeltRecipe(kind,inputSlot){
 if(!inputSlot)return null;
 const nm=slotName(inputSlot);if(!nm)return null;
 const rtype=kind=='blast_furnace'?'blasting':kind=='smoker'?'smoking':'smelting';
 const list=SMELT_RECIPES[rtype];
 for(const r of list)if(r.ing.has(nm))return r;
 return null;
}

function ensureFurnaceBE(x,y,z,kind){
 let be=getBE(x,y,z);
 if(!be||be.type!=='furnace'){
  be={type:'furnace',kind,slots:[null,null,null],burn:0,burnMax:0,cook:0,cookMax:kind=='furnace'?200:100};
  setBE(x,y,z,be);
 }
 return be;
}

function canSmelt(be,rec){
 if(!rec||!be.slots[0])return false;
 const rk=resolveItem(rec.rn);if(rk===null||rk===undefined)return false;
 const out=be.slots[2];
 if(!out)return true;
 return out.k===rk&&out.n+rec.rc<=maxStack(rk);
}

function furnaceTick(){
 if(!BE.size)return;
 for(const [p,be] of BE){
  if(be.type!=='furnace')continue;
  const x=p&1023,z=(p>>10)&1023,y=p>>20;
  if(!isLd(x,z))continue;
  const b=id(x,y,z);
  if(!b||!isFurnaceName(B[b].n))continue;
  const wasLit=be.burn>0;
  if(be.burn>0)be.burn--;
  const rec=findSmeltRecipe(be.kind,be.slots[0]);
  const ok=canSmelt(be,rec);
  if(ok){
   be.cookMax=rec.time||(be.kind=='furnace'?200:100);
   if(be.burn===0&&be.slots[1]){
    const ft0=getFuelTime(be.slots[1]);
    const ft=be.kind=='furnace'?ft0:Math.floor(ft0/2);
    if(ft>0){
     be.burn=be.burnMax=ft;
     const fnm=slotName(be.slots[1]);
     if(fnm=='lava_bucket'){const bk=resolveItem('bucket');be.slots[1]=bk!==null?{k:bk,n:1}:null}
     else{be.slots[1].n--;if(be.slots[1].n<=0)be.slots[1]=null}
    }
   }
   if(be.burn>0){
    be.cook++;
    if(tick%20==0&&Math.random()<.35){
     playSound(be.kind=='blast_furnace'?'block.blastfurnace.fire_crackle':be.kind=='smoker'?'block.smoker.smoke':'block.furnace.fire_crackle',.8,1);
    }
    if(be.cook>=be.cookMax){
     const rk=resolveItem(rec.rn);
     if(rk!==null&&rk!==undefined){
      if(!be.slots[2])be.slots[2]={k:rk,n:rec.rc};
      else be.slots[2].n+=rec.rc;
      be.slots[0].n--;
      if(be.slots[0].n<=0)be.slots[0]=null;
     }
     be.cook=0;
    }
   }else if(be.cook>0){
    be.cook=Math.max(0,be.cook-2);
   }
  }else{
   be.cook=0;
  }
  const isLit=be.burn>0;
  if(isLit!==wasLit){
   const pr=getBlockPropsAt(x,y,z);
   if(pr)setBlockPropsAt(x,y,z,Object.assign({},pr,{lit:isLit?'true':'false'}),true);
  }
 }
}

function furnaceClick(b,shift){
 if(!activeBEPos)return;
 const [bx,by,bz]=activeBEPos,be=getBE(bx,by,bz);if(!be)return;
 let hit=false;
 for(const s of furnaceSlots(be))if(inb(s,18)){
  hit=true;const c=s.get();
  if(shift&&c){
   const cp=Object.assign({},c);
   if(s.t.startsWith('f_')){if(giveInv(cp))s.set(null);else s.set(cp);if(s.out)playSound('ui.button.click',.3,1.2)}
   else{
    if(findSmeltRecipe(be.kind,cp)){
     const dst=be.slots[0];
     if(!dst){be.slots[0]=cp;s.set(null)}
     else if(dst.k===cp.k&&dst.n<maxStack(dst.k)){const t=Math.min(maxStack(dst.k)-dst.n,cp.n);dst.n+=t;cp.n-=t;s.set(cp.n>0?cp:null)}
    }else if(getFuelTime(cp)>0){
     const dst=be.slots[1];
     if(!dst){be.slots[1]=cp;s.set(null)}
     else if(dst.k===cp.k&&dst.n<maxStack(dst.k)){const t=Math.min(maxStack(dst.k)-dst.n,cp.n);dst.n+=t;cp.n-=t;s.set(cp.n>0?cp:null)}
    }else if(s.t=='i'){if(giveInv(cp,0,9))s.set(null);else s.set(cp)}
    else if(s.t=='h'){if(giveInv(cp,9,36))s.set(null);else s.set(cp)}
   }
   return;
  }
  if(s.out){
   if(!c)return;
   if(!cursor||(cursor.k===c.k&&cursor.n+c.n<=maxStack(c.k))){
    if(!cursor)cursor={k:c.k,n:c.n};else cursor.n+=c.n;
    s.set(null);playSound('ui.button.click',.3,1.2);
   }
   return;
  }
  if(b==0){
   if(cursor&&c&&c.k===cursor.k){const t=Math.min(maxStack(c.k)-c.n,cursor.n);c.n+=t;cursor.n-=t;if(cursor.n<=0)cursor=null}
   else{s.set(cursor);cursor=c}
  }else if(cursor){
   if(!c){s.set({k:cursor.k,n:1});cursor.n--}
   else if(c.k===cursor.k&&c.n<maxStack(c.k)){c.n++;cursor.n--}
   if(cursor.n<=0)cursor=null;
  }else if(c){
   const h=Math.ceil(c.n/2);cursor={k:c.k,n:h};c.n-=h;if(c.n<=0)s.set(null);
  }
  return;
 }
 if(!hit&&cursor){throwItem(cursor);cursor=null}
}

function ensureChestBE(x,y,z){
 let be=getBE(x,y,z);
 if(!be||be.type!=='chest'){be={type:'chest',slots:Array(27).fill(null)};setBE(x,y,z,be)}
 return be;
}
async function populateChestLoot(be){
 if(!be||!be.lootTable)return;
 const ltPath=rl(be.lootTable);be.lootTable=null;
 const lt=await djson('loot_table/'+ltPath)||await djson('loot_tables/'+ltPath);
 if(!lt)return;
 const ctx={props:{},tool:null,tags:new Set()},items=[];
 for(const p of lt.pools||[]){
  if(!condOK(p.conditions,ctx))continue;
  const rolls=evalCount(p.rolls);
  for(let r=0;r<rolls;r++){
   const es=p.entries||[];const sum=es.reduce((a,e)=>a+(e.weight||1),0);
   let x=Math.random()*sum;
   for(const e of es){x-=(e.weight||1);if(x<=0){evalEntry(e,ctx,items);break}}
  }
 }
 const free=[];for(let i=0;i<27;i++)if(!be.slots[i])free.push(i);
 for(let i=free.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[free[i],free[j]]=[free[j],free[i]]}
 for(const [nm,cnt] of items){
  if(!free.length)break;
  let k=resolveItem(nm);
  if(k===null){await addBlock(nm);rebuildBI();k=resolveItem(nm)}
  if(k===null)continue;
  let rem=cnt;const mx=maxStack(k);
  while(rem>0&&free.length){const n=Math.min(mx,rem);be.slots[free.pop()]={k,n};rem-=n}
 }
}
const CHEST_SIDES={south:{left:[-1,0],right:[1,0]},north:{left:[1,0],right:[-1,0]},east:{left:[0,1],right:[0,-1]},west:{left:[0,-1],right:[0,1]}};
async function placeChestBlock(r,k,p){
 const [px,py,pz]=p;if(py<0||py>=H||isS(px,py,pz))return false;
 const look=LOOKS[Math.floor((((P.yaw%360)+360)%360+45)/90)%4];
 const facing=OPPO[look],sides=CHEST_SIDES[facing];
 let type='single',partner=null,partnerType=null;
 if(!P.sneak){
  for(const [myT,nbT] of [['left','right'],['right','left']]){
   const [dx,dz]=sides[myT],nx=px+dx,nz=pz+dz;
   if(nx>=0&&nz>=0&&nx<W&&nz<W&&id(nx,py,nz)==k){
    const npr=getBlockPropsAt(nx,py,nz)||{facing:'north',type:'single'};
    if(npr.facing===facing&&(npr.type||'single')==='single'){
     type=myT;partner=[nx,py,nz];partnerType=nbT;break;
    }
   }
  }
 }
 const sid=await ensureState(k,{facing,type,waterlogged:'false'});
 if(isS(px,py,pz))return false;
 if(partner){
  const psid=await ensureState(k,{facing,type:partnerType,waterlogged:'false'});
  if(psid){sworld[ix(...partner)]=psid;recEdit(...partner);dirtyAt(partner[0],partner[2])}
 }
 STAT.placed++;blkSnd(k,'place',1,.8+Math.random()*.2);
 setB(px,py,pz,k,sid);
 return true;
}
function unlinkChestPartner(x,y,z,b,pr){

 const [dx,dz]=pr.type==='left'?sides.left:sides.right;

}

 if(pr.type==='left'||pr.type==='right'){
  const sides=CHEST_SIDES[pr.facing||'north'];

   activeBEPos=[x,y,z];openChestPos=[x,y,z];

 }

 activeChestGroup={title:'Chest',rows:3,bes:[be],coords:[[x,y,z]]};
 activeBEPos=[x,y,z];openChestPos=[x,y,z];
 playSound('block.chest.open',.5,.9+Math.random()*.1);
 openScreen('chest');
}

const NO_COLL_RX=/^(wheat|carrots|potatoes|beetroots|.*torch|short_grass|grass|dandelion|poppy|azure_bluet|cornflower|oxeye_daisy|dead_bush|snow|sugar_cane|vine|fern|large_fern|tall_grass)$/;
const TORCH_WALL_MAP={torch:'wall_torch',soul_torch:'soul_wall_torch',redstone_torch:'redstone_wall_torch'};
const WALL_TORCH_ITEM_MAP={wall_torch:'torch',soul_wall_torch:'soul_torch',redstone_wall_torch:'redstone_torch'};
const WALL_FACING_OFFSET={north:[0,0,-1],south:[0,0,1],east:[1,0,0],west:[-1,0,0]};

function canSupportWallTorch(x,y,z){
 const b=id(x,y,z);if(b<=0||isF(b))return false;
 const nm=B[b].n;
 if(NO_COLL_RX.test(nm)||/(_door|_trapdoor|_fence|_fence_gate|wall|pane|bars|slab|stairs|_bed|chest|barrel|cactus|farmland|snow)$/.test(nm))return false;
 return !!B[b].tex||(B[b].coll!==false);
}
function canSupportFloorTorch(x,y,z){
 const b=id(x,y,z);if(b<=0||isF(b))return false;
 const nm=B[b].n;
 if(NO_COLL_RX.test(nm)||/(_door|_trapdoor|_fence_gate|pane|bars|_bed|cactus|farmland|snow)$/.test(nm))return false;
 if(/(_fence|wall|hopper|anvil)$/.test(nm))return true;
 const st=sworld[ix(x,y,z)]&&STATE[sworld[ix(x,y,z)]];
 if(st&&st.props){
  if(/slab$/.test(nm))return st.props.type==='top'||st.props.type==='double';
  if(/stairs$/.test(nm))return st.props.half==='top';
 }
 return !!B[b].tex||(B[b].coll!==false);
}
async function placeTorchBlock(r,k,p,n){
 const [px,py,pz]=p;
 if(py<0||py>=H||id(px,py,pz)!==0)return false;
 if(r.n[1]===0){
  if(!canSupportWallTorch(r.c[0],r.c[1],r.c[2]))return false;
  const facing=r.n[2]===-1?'north':r.n[2]===1?'south':r.n[0]===1?'east':'west';
  const wallName=TORCH_WALL_MAP[n];
  let wk=bi(wallName);
  if(!wk){await addBlock(wallName);rebuildBI();wk=bi(wallName)}
  if(!wk)return false;
  const pr=wallName==='redstone_wall_torch'?{facing,lit:'true'}:{facing};
  const sid=await ensureState(wk,pr);
  if(id(px,py,pz)!==0)return false;
  STAT.placed++;blkSnd(wk,'place',1,.8+Math.random()*.2);
  setB(px,py,pz,wk,sid);
  return true;
 }
 if(r.n[1]===1){
  if(!canSupportFloorTorch(px,py-1,pz))return false;
  let sid=0;
  if(n==='redstone_torch')sid=await ensureState(k,{lit:'true'});
  if(id(px,py,pz)!==0)return false;
  STAT.placed++;blkSnd(k,'place',1,.8+Math.random()*.2);
  setB(px,py,pz,k,sid);
  return true;
 }
 return false;
}

const CROP_SEEDS={wheat_seeds:'wheat',carrot:'carrots',potato:'potatoes',beetroot_seeds:'beetroots'};
const CROP_MAX_AGE={wheat:7,carrots:7,potatoes:7,beetroots:3};
const isCropName=n=>CROP_MAX_AGE[n]!==undefined;

function hasWaterForFarmland(x,y,z){
 for(let dy=0;dy<=1;dy++)for(let dz=-4;dz<=4;dz++)for(let dx=-4;dx<=4;dx++){
  const X=x+dx,Y=y+dy,Z=z+dz;
  if(X<0||Y<0||Z<0||X>=W||Y>=H||Z>=W||!isLd(X,Z))continue;
  if(WID>0&&world[ix(X,Y,Z)]===WID)return true;
 }
 return false;
}

function tryTill(r,cs){
 if(!r||r.n[1]===-1)return false;
 const [x,y,z]=r.c,b=id(x,y,z);if(!b)return false;
 const nm=B[b].n;
 if(y+1>=H||id(x,y+1,z)!==0)return false;
 if(nm==='dirt'||nm==='grass_block'||nm==='dirt_path'){
  const fm=bi('farmland')||idx('farmland');if(!fm)return false;
  const moist=hasWaterForFarmland(x,y,z)?'7':'0';
  ensureState(fm,{moisture:moist}).then(sid=>{
   if(id(x,y,z)===b)setB(x,y,z,fm,sid);
  });
  playSound('item.hoe.till',1,1);
  useDur(hotbar,sel,1);
  swing=1;swingK='place';
  return true;
 }
 if(nm==='coarse_dirt'||nm==='rooted_dirt'){
  const dt=bi('dirt')||idx('dirt');if(!dt)return false;
  setB(x,y,z,dt,0);
  playSound('item.hoe.till',1,1);
  useDur(hotbar,sel,1);
  swing=1;swingK='place';
  return true;
 }

}

async function tryBoneMeal(r,cs){
 if(!r)return false;
 const [x,y,z]=r.c,b=id(x,y,z);if(!b)return false;
 const nm=B[b].n,maxAge=CROP_MAX_AGE[nm];
 if(maxAge===undefined)return false;

 await setBlockPropsAt(x,y,z,Object.assign({},pr,{age:String(nextAge)}),true);
 playSound('item.bone_meal.use',1,1);
 spawnBoneMealParticles(x,y,z);

function trampleFarmland(x,y,z){
 if(x<0||y<0||z<0||x>=W||y>=H||z>=W||!isLd(x,z))return;
 const b=id(x,y,z);if(!b||B[b].n!=='farmland')return;
 const dt=bi('dirt')||idx('dirt');if(!dt)return;
 setB(x,y,z,dt,0);
}

function tickFarmland(x,y,z){
 const b=id(x,y,z);if(!b||B[b].n!=='farmland')return;
 const pr=getBlockPropsAt(x,y,z)||{moisture:'0'};
 const curM=parseInt(pr.moisture||'0',10)||0;
 if(hasWaterForFarmland(x,y,z)){
  if(curM<7)setBlockPropsAt(x,y,z,{moisture:'7'},false);
 }else if(curM>0){
  setBlockPropsAt(x,y,z,{moisture:String(curM-1)},false);
 }else{
  const above=y+1<H?id(x,y+1,z):0;
  if(!above||!isCropName(B[above].n)){
   const dt=bi('dirt')||idx('dirt');
   if(dt)setB(x,y,z,dt,0);
  }
 }
}

function cropGrowthPoints(x,y,z,cropId){
 let pts=1;
 const fy=y-1;
 for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){
  const nb=id(x+dx,fy,z+dz);
  if(nb&&B[nb].n==='farmland'){
   const pr=getBlockPropsAt(x+dx,fy,z+dz);
   const m=pr?parseInt(pr.moisture||'0',10):0;
   const add=m>0?3:1;
   pts+=(dx===0&&dz===0)?add:(add*.25);
  }
 }
 const nSame=(id(x-1,y,z)===cropId||id(x+1,y,z)===cropId);
 const zSame=(id(x,y,z-1)===cropId||id(x,y,z+1)===cropId);
 if(nSame&&zSame)pts*=.5;
 else if((id(x-1,y,z-1)===cropId||id(x+1,y,z-1)===cropId||id(x-1,y,z+1)===cropId||id(x+1,y,z+1)===cropId))pts*=.5;
 return pts;
}

function tickCrop(x,y,z,b){
 const nm=B[b].n,maxAge=CROP_MAX_AGE[nm];if(maxAge===undefined)return;
 if(y<=0||B[id(x,y-1,z)]?.n!=='farmland'){breakBlock([x,y,z]);return}
 if(lightAt(x,y,z)<9)return;
 const pr=getBlockPropsAt(x,y,z)||{age:'0'};
 const curAge=parseInt(pr.age||'0',10)||0;
 if(curAge>=maxAge)return;
 const pts=cropGrowthPoints(x,y,z,b);
 if(Math.random()<1/(Math.floor(25/pts)+1)){
  setBlockPropsAt(x,y,z,Object.assign({},pr,{age:String(curAge+1)}),false);
 }
}

  const cx=pcx+dx,cz=pcz+dz;
  if(cx<0||cz<0||cx>=NC||cz>=NC)continue;
  const k=(cz<<6)|cx;
  if(slotOwn[((cz&15)<<4)|(cx&15)]!==k)continue;
  const x0=cx<<4,z0=cz<<4;
  for(let s=0;s<3;s++){
   const x=x0+((Math.random()*16)|0),z=z0+((Math.random()*16)|0),y=1+((Math.random()*(H-2))|0);
   const b=world[ix(x,y,z)];if(!b)continue;
   if(b===fmId)tickFarmland(x,y,z);
   else if(CROP_MAX_AGE[B[b].n]!==undefined)tickCrop(x,y,z,b);
  }

const suppChecking=new Set();
function checkSupportAt(x,y,z){
 if(x<0||y<0||z<0||x>=W||y>=H||z>=W||!isLd(x,z))return;
 const b=id(x,y,z);if(!b)return;
 const nm=B[b].n;
 if(TORCH_WALL_MAP[nm]){
  if(y<=0||!canSupportFloorTorch(x,y-1,z))breakBlock([x,y,z]);
  return;
 }
 if(WALL_TORCH_ITEM_MAP[nm]){
  const pr=getBlockPropsAt(x,y,z)||{facing:'north'};
  const off=WALL_FACING_OFFSET[pr.facing||'north']||[0,0,-1];
  if(!canSupportWallTorch(x-off[0],y,z-off[2]))breakBlock([x,y,z]);
  return;
 }
 if(isCropName(nm)){
  if(y<=0||B[id(x,y-1,z)]?.n!=='farmland')breakBlock([x,y,z]);
 }
}
function checkSupportAround(x,y,z){
 const targets=[[x,y,z],[x,y+1,z],[x-1,y,z],[x+1,y,z],[x,y,z-1],[x,y,z+1]];
 for(const [tx,ty,tz] of targets){
  if(tx<0||ty<0||tz<0||tx>=W||ty>=H||tz>=W)continue;
  const pk=pk3(tx,ty,tz);
  if(suppChecking.has(pk))continue;
  suppChecking.add(pk);
  try{checkSupportAt(tx,ty,tz)}finally{suppChecking.delete(pk)}
 }
}

function fallbackBlockDrops(name,props){

function spawnInitialMobs(cx,cz){

 for(let tries=0;tries<160&&spawned<12;tries++){
  const ang=Math.random()*Math.PI*2,dist=8+Math.random()*34;
  const x=Math.floor(cx+Math.cos(ang)*dist),z=Math.floor(cz+Math.sin(ang)*dist);
  if(x<4||z<4||x>=W-4||z>=W-4||!isLd(x,z))continue;
  const sy=surfY(x,z);
  if(sy<=SEA)continue;

  if(!top||B[top].n!=='grass_block')continue;

  const t=types[spawned%types.length];
  spawnMob(t,x+.5,sy+1,z+.5);

}

function moveMob(m,dx,dy,dz){
 const o=HW;HW=m.hw;
 const ox=m.x,oy=m.y,oz=m.z;
 const rx=sweep(m,'x',dx,m.h),rz=sweep(m,'z',dz,m.h),ry=sweep(m,'y',dy,m.h);
 if((rx||rz)&&m.g&&dy<=0&&(dx||dz)){
  const q={x:ox,y:oy,z:oz};
  if(!sweep(q,'y',1.05,m.h)&&!sweep(q,'x',dx,m.h)&&!sweep(q,'z',dz,m.h)){
   sweep(q,'y',-1.05,m.h);
   if(Math.hypot(q.x-ox,q.z-oz)>Math.hypot(m.x-ox,m.z-oz)){
    m.x=q.x;m.y=q.y;m.z=q.z;HW=o;return{x:0,y:1,z:0};
   }
  }
 }
 HW=o;
 return{x:rx,y:ry,z:rz};
}

function hurtMob(m,amount,kx=0,ky=0,kz=0){
 if(m.dead>0||m.inv>0)return;
 m.hp-=amount;m.hurt=10;m.inv=10;
 m.vx=m.vx/2+kx;m.vy=Math.min(.45,m.vy/2+ky);m.vz=m.vz/2+kz;m.g=false;
 if(!m.hostile)m.panic=80;
 if(m.hp<=0){
  m.hp=0;m.dead=20;
  if(m.def.snd.death)playSound(m.def.snd.death,1,.9+Math.random()*.2);
  dropMobLoot(m);
 }else{
  if(m.def.snd.hurt)playSound(m.def.snd.hurt,1,.9+Math.random()*.2);
 }
}

async function dropMobLoot(m){
 const onFire=m.fire>0;
 let lt=mobLootCache.get(m.type);
 if(lt===undefined){
  lt=await djson('loot_table/'+m.def.loot)||await djson('loot_tables/'+m.def.loot)||null;
  mobLootCache.set(m.type,lt);
 }
 let dropsOut=[];
 if(lt&&!(m.type==='sheep'&&m.sheared)){
  const ctx={props:{},tool:null,tags:new Set()};
  for(const p of lt.pools||[]){
   if(!condOK(p.conditions,ctx))continue;
   const rolls=evalCount(p.rolls);
   for(let r=0;r<rolls;r++){
    const es=p.entries||[],sum=es.reduce((a,e)=>a+(e.weight||1),0);
    let x=Math.random()*sum;
    for(const e of es){x-=(e.weight||1);if(x<=0){evalEntry(e,ctx,dropsOut);break}}
   }
  }
 }
 if(!dropsOut.length)dropsOut=m.def.fallbackDrop(onFire,m);
 const COOK_MAP={porkchop:'cooked_porkchop',beef:'cooked_beef',mutton:'cooked_mutton',chicken:'cooked_chicken'};
 for(let [nm,cnt] of dropsOut){
  if(onFire&&COOK_MAP[nm])nm=COOK_MAP[nm];
  const k=resolveItem(nm);
  if(k!==null&&cnt>0)spawnDrop({k,n:cnt},m.x,m.y+.3,m.z,(Math.random()-.5)*.14,.18,(Math.random()-.5)*.14,10);
 }
}

 hitT=35;
}
