function hasLineOfSight(ax,ay,az,bx,by,bz){
 const dx=bx-ax,dy=by-ay,dz=bz-az,dist=Math.hypot(dx,dy,dz);
 const steps=Math.ceil(dist*3);
 for(let i=1;i<steps;i++){
  const t=i/steps,x=Math.floor(ax+dx*t),y=Math.floor(ay+dy*t),z=Math.floor(az+dz*t);
  if(opq(id(x,y,z)))return false;
 }
 return true;
}

function mobTick(){
 // 自然スポーン処理（20tickごと）
 if(++mobSpawnCd>=20){
  mobSpawnCd=0;
  const pcx=Math.floor(P.x),pcz=Math.floor(P.z);
  const passiveCnt=mobs.filter(m=>!m.hostile).length;
  const hostileCnt=mobs.filter(m=>m.hostile).length;
  const isNight=skyDark>=7;
  for(let attempt=0;attempt<4;attempt++){
   const ang=Math.random()*Math.PI*2,dist=18+Math.random()*30;
   const x=Math.floor(pcx+Math.cos(ang)*dist),z=Math.floor(pcz+Math.sin(ang)*dist);
   if(x<4||z<4||x>=W-4||z>=W-4||!isLd(x,z))continue;
   const y=surfY(x,z)+1;
   if(y<=SEA||y>=H-3)continue;
   if(id(x,y,z)!==0||id(x,y+1,z)!==0)continue;
   const ground=id(x,y-1,z);
   if(!ground||isF(ground))continue;
   const lt=lightAt(x,y,z);
   if(isNight&&hostileCnt<16&&lt===0&&opq(ground)){
    const hTypes=['zombie','zombie','skeleton','creeper'];
    spawnMob(hTypes[Math.floor(Math.random()*hTypes.length)],x+.5,y,z+.5);
    break;
   }else if(!isNight&&passiveCnt<16&&B[ground].n==='grass_block'&&skyL[ix(x,y,z)]>=9){
    const pTypes=['pig','cow','sheep','chicken'];
    spawnMob(pTypes[Math.floor(Math.random()*pTypes.length)],x+.5,y,z+.5);
    break;
   }
  }
 }

 const heldItem=hotbar[sel]?slotName(hotbar[sel]):null;
 for(let i=mobs.length-1;i>=0;i--){
  const m=mobs[i];
  m.px=m.x;m.py=m.y;m.pz=m.z;
  const distP=Math.hypot(m.x-P.x,m.z-P.z);
  if(!isLd(Math.floor(m.x),Math.floor(m.z))||distP>72){
   if(m.model&&m.model.o)scene.remove(m.model.o);
   mobs.splice(i,1);continue;
  }
  if(m.hurt>0)m.hurt--;
  if(m.inv>0)m.inv--;
  if(m.atkCd>0)m.atkCd--;
  if(m.panic>0)m.panic--;

  // 死亡アニメーション後の消滅
  if(m.dead>0){
   if(--m.dead<=0){
    if(m.model&&m.model.o)scene.remove(m.model.o);
    mobs.splice(i,1);
   }
   continue;
  }

  const bx=Math.floor(m.x),by=Math.floor(m.y),bz=Math.floor(m.z);
  const inW=fluidAt(m.x,m.y+.2,m.z),inL=lavaAt(m.x,m.y+.2,m.z);

  // 炎上判定（溶岩接触 or アンデッドの日光浴）
  if(inL)m.fire=Math.max(m.fire,100);
  if(inW&&!inL)m.fire=0;
  if(m.def.undead&&!inW&&weather==='clear'&&skyDark<=3&&skyL[ix(bx,Math.min(H-1,by+1),bz)]>=12){
   m.fire=Math.max(m.fire,40);
  }
  if(m.fire>0){
   m.fire--;
   if(m.fire%20===0)hurtMob(m,1);
   if(m.dead>0)continue;
  }

  // 環境音（鳴き声）
  if(m.def.snd.amb&&Math.random()<1/260){
   playSound(m.def.snd.amb,.7,.9+Math.random()*.2);
  }

  // ニワトリの産卵
  if(m.type==='chicken'&&--m.eggT<=0){
   m.eggT=2400+Math.floor(Math.random()*2400);
   const ek=resolveItem('egg');
   if(ek!==null){
    spawnDrop({k:ek,n:1},m.x,m.y+.2,m.z,(Math.random()-.5)*.05,.08,(Math.random()-.5)*.05,10);
    playSound('entity.chicken.egg',1,.9+Math.random()*.2);
   }
  }

  // AI行動決定
  let moveSpd=0,targetYaw=m.yaw;
  const canTargetPlayer=m.hostile&&gm==='survival'&&P.hp>0&&distP<24;

  if(canTargetPlayer){
   const dx=P.x-m.x,dz=P.z-m.z;
   targetYaw=Math.atan2(-dx,dz)*180/Math.PI;
   m.pitch=Math.max(-35,Math.min(35,-Math.atan2((P.y+1.4)-(m.y+m.h*.85),distP)*180/Math.PI));

   if(m.type==='creeper'){
    if(distP<3.0&&hasLineOfSight(m.x,m.y+1,m.z,P.x,P.y+1,P.z)){
     if(m.swell===0)playSound('entity.creeper.primed',1,.5);
     m.swell++;
     moveSpd=m.def.speed*.3;
     if(m.swell>=30){
      if(m.model&&m.model.o)scene.remove(m.model.o);
      mobs.splice(i,1);
      explode(m.x,m.y+.85,m.z,3.0);
      continue;
     }
    }else{
     if(m.swell>0)m.swell=Math.max(0,m.swell-1);
     moveSpd=m.def.speed;
    }
   }else if(m.type==='skeleton'){
    const los=distP<15&&hasLineOfSight(m.x,m.y+1.6,m.z,P.x,P.y+1.3,P.z);
    if(los){
     moveSpd=distP<6?-m.def.speed*.5:0;
     if(m.atkCd<=0){
      m.atkCd=45;
      shootArrow(m.x,m.y+1.55,m.z,P.x,P.y+1.2,P.z,1.45,3.5,m);
      playSound('entity.skeleton.shoot',1,1/(Math.random()*.4+.8));
     }
    }else{
     moveSpd=m.def.speed;
    }
   }else{
    // ゾンビ近接追跡・攻撃
    moveSpd=m.def.speed;
    if(distP<1.55&&Math.abs(P.y-m.y)<1.5&&m.atkCd<=0){
     m.atkCd=20;
     if(hurtPlayer(m.def.dmg,false,[m.x,m.y,m.z],m)!==false){
      const yr=targetYaw*Math.PI/180;
      P.vx+=-Math.sin(yr)*.35;P.vz+=Math.cos(yr)*.35;P.vy=Math.max(P.vy,.25);
     }
    }
   }
  }else{
   if(m.type==='creeper'&&m.swell>0)m.swell=Math.max(0,m.swell-1);
   m.pitch=0;
   // 餌での追従（家畜）
   if(!m.hostile&&heldItem&&m.def.foods&&m.def.foods.has(heldItem)&&distP<10&&m.panic===0){
    const dx=P.x-m.x,dz=P.z-m.z;
    targetYaw=Math.atan2(-dx,dz)*180/Math.PI;
    moveSpd=distP>2.2?m.def.speed*1.15:0;
   }else{
    // ランダム徘徊・パニック逃走
    if(--m.aiT<=0){
     if(m.panic>0){
      m.aiT=12+Math.floor(Math.random()*15);
      m.moveDir=Math.random()*360;
     }else if(Math.random()<.45){
      m.aiT=30+Math.floor(Math.random()*50);
      m.moveDir=Math.random()*360;
     }else{
      m.aiT=30+Math.floor(Math.random()*60);
      m.moveDir=null;
     }
     // ヒツジの草食べ＆羊毛再生
     if(m.type==='sheep'&&m.sheared&&m.g&&Math.random()<.25){
      const gb=by>0?id(bx,by-1,bz):0;
      if(gb&&B[gb].n==='grass_block'){
       const dt=bi('dirt')||idx('dirt');
       if(dt)setB(bx,by-1,bz,dt,0);
       m.sheared=false;
      }
     }
    }
    if(m.moveDir!==null){
     targetYaw=m.moveDir;
     moveSpd=m.def.speed*(m.panic>0?1.65:.75);
    }
   }
  }

  // 向きの補間
  let dyaw=((targetYaw-m.yaw+540)%360)-180;
  m.yaw+=Math.max(-18,Math.min(18,dyaw));

  // 移動ベクトル適用
  const yr=m.yaw*Math.PI/180;
  if(moveSpd!==0){
   const ac=inW?.025:(m.g?moveSpd*.45:moveSpd*.12);
   m.vx+=-Math.sin(yr)*ac;
   m.vz+=Math.cos(yr)*ac;
  }

  // 水泳＆段差ジャンプ
  if(inW){
   m.vy=Math.min(.22,m.vy+.045);
  }else if(m.g&&moveSpd>0){
   const fx=Math.floor(m.x-Math.sin(yr)*(m.hw+.35));
   const fz=Math.floor(m.z+Math.cos(yr)*(m.hw+.35));
   if(solid(fx,by,fz)&&!solid(fx,by+1,fz)){
    m.vy=.42;m.g=false;
   }
  }

  const wg=m.g;
  const r=moveMob(m,m.vx,m.vy,m.vz);
  m.g=m.vy<0&&r.y;
  if(r.x||r.z){
   if(m.moveDir!==null&&!canTargetPlayer)m.moveDir=(m.moveDir+110+Math.random()*140)%360;
   if(r.x)m.vx=0;if(r.z)m.vz=0;
  }
  if(r.y)m.vy=0;

  if(inW){
   m.vy=(m.vy-(inL?.02:.005))*.8;
   m.vx*=.8;m.vz*=.8;m.fall=0;
  }else{
   if(m.vy<0)m.fall-=m.vy;
   if(m.g){
    if(m.type!=='chicken'&&m.fall>3.5)hurtMob(m,Math.floor(m.fall-3));
    m.fall=0;
   }
   const grav=m.type==='chicken'&&m.vy<0?.025:.08;
   m.vy=(m.vy-grav)*.98;
   const fr=wg?.546:.91;
   m.vx*=fr;m.vz*=fr;
  }
  for(const k of['vx','vy','vz'])if(Math.abs(m[k])<.002)m[k]=0;

  const stepDist=Math.hypot(m.x-m.px,m.z-m.pz);
  m.ph+=stepDist*4;
  m.amp+=(Math.min(1,stepDist*5)-m.amp)*.35;
  if(m.type==='chicken')m.wingPh+=m.g?0:.8;
  if(m.g&&m.def.snd.step){
   m.stepD+=stepDist;
   if(m.stepD>1.5){m.stepD=0;playSound(m.def.snd.step,.15,1)}
  }
 }
}

function mobMeshes(al){
 for(const m of mobs){
  if(!m.model){
   if(!m.loading){
    m.loading=true;
    Promise.all([getMobTex(m.def.tex),m.def.furTex?getMobTex(m.def.furTex):null]).then(([ti,fi])=>{
     m.model=buildMobModel(m.type,ti,fi);
     scene.add(m.model.o);
    });
   }
   continue;
  }
  const md=m.model;
  const x=m.px+(m.x-m.px)*al,y=m.py+(m.y-m.py)*al,z=m.pz+(m.z-m.pz)*al;
  md.o.position.set(x,y,z);
  md.o.rotation.y=-m.yaw*Math.PI/180;
  // 死亡時の横倒し演出
  md.o.rotation.z=m.dead>0?Math.min(1,(20-m.dead+al)/10)*(Math.PI/2):0;

  if(md.head){
   md.head.rotation.x=m.pitch*Math.PI/180;
  }
  const legAng=Math.cos(m.ph*.6662)*1.3*m.amp;
  if(md.legs.length===4){
   md.legs[0].rotation.x=legAng;
   md.legs[1].rotation.x=-legAng;
   md.legs[2].rotation.x=-legAng;
   md.legs[3].rotation.x=legAng;
  }else if(md.legs.length===2){
   md.legs[0].rotation.x=-legAng;
   md.legs[1].rotation.x=legAng;
  }
  if(md.arms.length===2&&m.type!=='zombie'){
   md.arms[0].rotation.x=legAng*.6;
   md.arms[1].rotation.x=-legAng*.6;
  }
  if(md.wings.length===2){
   const flp=m.g?0:(Math.sin(m.wingPh)+1)*.7;
   md.wings[0].rotation.z=flp;
   md.wings[1].rotation.z=-flp;
  }
  if(m.type==='sheep'){
   for(const fm of md.furMeshes)fm.visible=!m.sheared;
  }
  if(md.fireMesh)md.fireMesh.visible=m.fire>0;

  // クリーパー膨張＆点滅 / 被ダメージ赤点滅
  if(m.type==='creeper'&&m.swell>0){
   const f=(m.swell+al)/30;
   const s=1+Math.sin(f*Math.PI*2)*f*.12+f*.25;
   md.o.scale.set(s,1/Math.sqrt(s),s);
   const flash=Math.floor(m.swell/3)%2===0;
   md.mat.color.setHex(m.hurt>0?0xff6060:flash?0xffffff:0x99cc99);
  }else{
   md.o.scale.set(1,1,1);
   const hex=m.hurt>0?0xff6060:0xffffff;
   md.mat.color.setHex(hex);
   if(md.furMat)md.furMat.color.setHex(hex);
  }
 }
}

// ---- 矢プロジェクタイル（スケルトン射撃・今後の弓にも対応） ----
function shootArrow(sx,sy,sz,tx,ty,tz,spd,damage,shooter){
 const dx=tx-sx,dy=ty-sy,dz=tz-sz,horiz=Math.hypot(dx,dz)||1;
 const aimY=dy+horiz*.16;
 const len=Math.hypot(dx,aimY,dz)||1;
 arrows.push({
  x:sx,y:sy,z:sz,px:sx,py:sy,pz:sz,
  vx:(dx/len)*spd,vy:(aimY/len)*spd,vz:(dz/len)*spd,
  dmg:damage,shooter,stuck:0,age:0,mesh:null
 });
}

function arrowTick(){
 for(let i=arrows.length-1;i>=0;i--){
  const a=arrows[i];
  a.px=a.x;a.py=a.y;a.pz=a.z;
  if(++a.age>400){if(a.mesh)scene.remove(a.mesh);arrows.splice(i,1);continue}
  if(a.stuck>0){
   if(--a.stuck<=0){if(a.mesh)scene.remove(a.mesh);arrows.splice(i,1)}
   continue;
  }
  const nx=a.x+a.vx,ny=a.y+a.vy,nz=a.z+a.vz;
  // プレイヤー命中判定
  if(a.shooter!==P&&gm==='survival'&&P.hp>0){
   if(Math.abs(nx-P.x)<HW+.15&&Math.abs(nz-P.z)<HW+.15&&ny>P.y&&ny<P.y+height()){
    hurtPlayer(a.dmg,false);
    const hl=Math.hypot(a.vx,a.vz)||1;
    P.vx+=(a.vx/hl)*.35;P.vz+=(a.vz/hl)*.35;P.vy=Math.max(P.vy,.2);
    playSound('entity.arrow.hit',1,1.2);
    if(a.mesh)scene.remove(a.mesh);arrows.splice(i,1);continue;
   }
  }
  // Mob命中判定
  let hitM=false;
  for(const m of mobs){
   if(m===a.shooter||m.dead>0)continue;
   if(Math.abs(nx-m.x)<m.hw+.15&&Math.abs(nz-m.z)<m.hw+.15&&ny>m.y&&ny<m.y+m.h){
    const hl=Math.hypot(a.vx,a.vz)||1;
    hurtMob(m,a.dmg,(a.vx/hl)*.35,.22,(a.vz/hl)*.35);
    playSound('entity.arrow.hit',1,1.2);
    hitM=true;break;
   }
  }
  if(hitM){if(a.mesh)scene.remove(a.mesh);arrows.splice(i,1);continue}
  // ブロック着弾判定
  if(solid(Math.floor(nx),Math.floor(ny),Math.floor(nz))){
   a.x=nx;a.y=ny;a.z=nz;a.stuck=100;
   playSound('entity.arrow.hit',1,1.2);
   continue;
  }
  a.x=nx;a.y=ny;a.z=nz;
  a.vx*=.99;a.vy=a.vy*.99-.05;a.vz*=.99;
 }
}

function arrowMeshes(al){
 for(const a of arrows){
  if(!a.mesh){
   const g=new THREE.Group();
   const mat=new THREE.MeshBasicMaterial({color:0x8b6b43,side:THREE.DoubleSide});
   const p1=new THREE.Mesh(new THREE.PlaneGeometry(.8,.12),mat);
   const p2=new THREE.Mesh(new THREE.PlaneGeometry(.8,.12),mat);p2.rotation.x=Math.PI/2;
   const tipM=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.12),new THREE.MeshBasicMaterial({color:0xb8b8b8}));tipM.position.x=.38;
   g.add(p1,p2,tipM);scene.add(g);a.mesh=g;
   rawImg('textures/entity/projectiles/arrow.png').then(c=>{
    if(!c)return;
    const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;
    const am=new THREE.MeshBasicMaterial({map:t,transparent:true,alphaTest:.3,side:THREE.DoubleSide});
    p1.material=am;p2.material=am;tipM.visible=false;
   });
  }
  a.mesh.position.set(a.px+(a.x-a.px)*al,a.py+(a.y-a.py)*al,a.pz+(a.z-a.pz)*al);
  const spd=Math.hypot(a.vx,a.vy,a.vz);
  if(spd>.01){
   a.mesh.rotation.order='YXZ';
   a.mesh.rotation.y=Math.atan2(-a.vz,a.vx);
   a.mesh.rotation.z=Math.atan2(a.vy,Math.hypot(a.vx,a.vz));
  }
 }
}


// ===== 第4弾アップデート：弓矢・投擲アイテム（雪玉・卵・エンダーパール）・盾 =====
const projectiles = [], itemCooldowns = new Map();
let bowPull = 0, shieldBlocking = false, shieldTexInfo = null, offHandGroup = null, offSig = '';

const CD_MAX = { ender_pearl: 20, shield: 100 };
const getItemCd = k => itemCooldowns.get(k) || 0;
const setItemCd = (k, ticks) => { if (ticks > 0) itemCooldowns.set(k, ticks); };

// クールダウン表示付きスロット描画へ拡張
const _origSlotDraw = slotDraw;
slotDraw = function(g, s, x, y) {
  _origSlotDraw(g, s, x, y);
  if (!s || typeof s.k !== 'string') return;
  const cd = getItemCd(s.k);
  if (cd > 0) {
    const mx = CD_MAX[s.k] || 20;
    const f = Math.min(1, cd / mx);
    const h = Math.ceil(16 * f);
    g.fillStyle = 'rgba(255,255,255,0.45)';
    g.fillRect(x, y + (16 - h), 16, h);
  }
};

// 盾の3Dモデル生成（textures/entity/shield_base_nopattern.png）
async function ensureShieldTex() {
  if (shieldTexInfo !== null) return shieldTexInfo;
  shieldTexInfo = false;
  const c = await rawImg('textures/entity/shield_base_nopattern.png');
  if (c) {
    const t = new THREE.CanvasTexture(c);
    t.magFilter = t.minFilter = THREE.NearestFilter;
    t.generateMipmaps = false;
    shieldTexInfo = { t, w: c.width, h: c.height };
  }
  return shieldTexInfo;
}

function createShield3D() {
  const g = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({
    map: shieldTexInfo ? shieldTexInfo.t : null,
    alphaTest: 0.5,
    side: THREE.DoubleSide
  });
  if (!shieldTexInfo) mat.color.setHex(0x8b6b43);
  const th = shieldTexInfo ? shieldTexInfo.h : 64;
  // 盾の板（12x22x1）＋持ち手（2x6x6）
  const plate = new THREE.Mesh(boxGeo(12, 22, 1, 0, 0, -11, 0, th), mat);
  const handle = new THREE.Mesh(boxGeo(2, 6, 6, 26, 0, -3, 0, th), mat);
  handle.position.set(0, 0, 3);
  g.add(plate, handle);
  g.scale.set(1 / 22, 1 / 22, 1 / 22);
  return g;
}

// 弓・矢の検索と射撃
function findArrowSlot() {
  if (off && off.k === 'arrow' && off.n > 0) return { arr: 'off', idx: 0 };
  for (let i = 0; i < 36; i++) {
    if (hotbar[i] && hotbar[i].k === 'arrow' && hotbar[i].n > 0) return { arr: 'hb', idx: i };
  }
  return null;
}

function releaseBow() {
  if (bowPull <= 0) return;
  const pull = bowPull;
  bowPull = 0;
  const cs = hotbar[sel];
  if (!cs || cs.k !== 'bow') return;

  const arrowRef = gm === 'creative' ? true : findArrowSlot();
  if (!arrowRef) return;

  let f = pull / 20;
  f = (f * f + f * 2) / 3;
  if (f < 0.1) return;
  if (f > 1) f = 1;

  if (gm === 'survival') {
    if (arrowRef.arr === 'off') {
      off.n--;
      if (off.n <= 0) off = null;
    } else {
      hotbar[arrowRef.idx].n--;
      if (hotbar[arrowRef.idx].n <= 0) hotbar[arrowRef.idx] = null;
    }
    useDur(hotbar, sel, 1);
  }

  const e = eye(1);
  const yr = P.yaw * Math.PI / 180, pr = P.pitch * Math.PI / 180;
  const dx = -Math.sin(yr) * Math.cos(pr);
  const dy = -Math.sin(pr);
  const dz = Math.cos(yr) * Math.cos(pr);
  const spd = f * 1.85;
  const crit = f >= 1;
  const dmgVal = f * 4.5 + (crit ? 2.5 : 0);

  arrows.push({
    x: e.x + dx * 0.3, y: e.y - 0.1 + dy * 0.3, z: e.z + dz * 0.3,
    px: e.x, py: e.y - 0.1, pz: e.z,
    vx: dx * spd, vy: dy * spd + 0.03, vz: dz * spd,
    dmg: dmgVal, shooter: P, fromPlayer: true, crit,
    stuck: 0, age: 0, mesh: null
  });

  swing = 1; swingK = 'place';
  playSound('entity.arrow.shoot', 1, 1 / (Math.random() * 0.4 + 1.2) + f * 0.5);
}

// 投擲アイテム（雪玉・卵・エンダーパール）の発射・物理・着弾
function throwProjectile(kind, cs) {
  if (getItemCd(kind) > 0) return false;
  const e = eye(1);
  const yr = P.yaw * Math.PI / 180, pr = P.pitch * Math.PI / 180;
  const dx = -Math.sin(yr) * Math.cos(pr);
  const dy = -Math.sin(pr);
  const dz = Math.cos(yr) * Math.cos(pr);
  const spd = 1.15;

  projectiles.push({
    kind,
    x: e.x + dx * 0.3, y: e.y - 0.1 + dy * 0.3, z: e.z + dz * 0.3,
    px: e.x, py: e.y - 0.1, pz: e.z,
    vx: dx * spd + P.vx * 0.3, vy: dy * spd + 0.08, vz: dz * spd + P.vz * 0.3,
    age: 0, mesh: null
  });

  if (kind === 'ender_pearl') setItemCd('ender_pearl', 20);
  if (gm === 'survival') {
    cs.n--;
    if (cs.n <= 0) hotbar[sel] = null;
  }
  swing = 1; swingK = 'place';
  playSound('entity.' + kind + '.throw', 0.6, 0.4 / (Math.random() * 0.4 + 0.8));
  return true;
}

function spawnImpactParticles(x, y, z, colorHex, count = 12) {
  for (let i = 0; i < count; i++) {
    if (parts.length > 400) killPart(parts.shift());
    const cv = document.createElement('canvas'); cv.width = cv.height = 8;
    const cx = cv.getContext('2d');
    cx.fillStyle = colorHex;
    cx.fillRect(1, 1, 6, 6);
    const tx = new THREE.CanvasTexture(cv);
    tx.magFilter = tx.minFilter = THREE.NearestFilter; tx.generateMipmaps = false;
    const mat = new THREE.MeshBasicMaterial({ map: tx, transparent: true, side: THREE.DoubleSide });
    const m = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.16), mat);
    m.position.set(x, y, z); scene.add(m);
    parts.push({
      m, x, y, z,
      vx: (Math.random() - 0.5) * 0.25,
      vy: Math.random() * 0.2 + 0.05,
      vz: (Math.random() - 0.5) * 0.25,
      age: 0, life: 12 + Math.floor(Math.random() * 8), g: false
    });
  }
}

function onProjectileImpact(p, hitMob) {
  if (p.kind === 'snowball') {
    spawnImpactParticles(p.x, p.y, p.z, '#ffffff', 10);
    if (hitMob) {
      const hl = Math.hypot(p.vx, p.vz) || 1;
      hurtMob(hitMob, 0.01, (p.vx / hl) * 0.35, 0.2, (p.vz / hl) * 0.35);
    }
  } else if (p.kind === 'egg') {
    spawnImpactParticles(p.x, p.y, p.z, '#e8dcc0', 10);
    if (hitMob) {
      const hl = Math.hypot(p.vx, p.vz) || 1;
      hurtMob(hitMob, 0.01, (p.vx / hl) * 0.3, 0.18, (p.vz / hl) * 0.3);
    }
    if (Math.random() < 0.125) {
      spawnMob('chicken', p.x, Math.max(1, p.y), p.z);
    }
  } else if (p.kind === 'ender_pearl') {
    spawnImpactParticles(p.x, p.y, p.z, '#b84dff', 22);
    const tx = Math.max(2, Math.min(W - 2, p.x));
    const tz = Math.max(2, Math.min(W - 2, p.z));
    let ty = Math.max(1, Math.min(H - 2, p.y));
    while (ty < H - 2 && hits(tx, ty, tz, height())) ty += 0.5;
    P.x = P.px = tx; P.y = P.py = ty; P.z = P.pz = tz;
    P.vx = P.vy = P.vz = 0; P.fall = 0;
    playSound('entity.enderman.teleport', 1, 1);
    hurtPlayer(5, true);
  }
}

function projTick() {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.px = p.x; p.py = p.y; p.pz = p.z;
    if (++p.age > 300 || p.y < -10) {
      if (p.mesh) scene.remove(p.mesh);
      projectiles.splice(i, 1);
      continue;
    }
    const nx = p.x + p.vx, ny = p.y + p.vy, nz = p.z + p.vz;
    let hitM = null;
    for (const m of mobs) {
      if (m.dead > 0) continue;
      if (Math.abs(nx - m.x) < m.hw + 0.18 && Math.abs(nz - m.z) < m.hw + 0.18 && ny > m.y && ny < m.y + m.h) {
        hitM = m; break;
      }
    }
    if (hitM || solid(Math.floor(nx), Math.floor(ny), Math.floor(nz))) {
      onProjectileImpact(p, hitM);
      if (p.mesh) scene.remove(p.mesh);
      projectiles.splice(i, 1);
      continue;
    }
    p.x = nx; p.y = ny; p.z = nz;
    p.vx *= 0.99; p.vy = p.vy * 0.99 - 0.03; p.vz *= 0.99;
  }
}

function projMeshes(al) {
  for (const p of projectiles) {
    if (!p.mesh) {
      const ic = iconOf(p.kind);
      if (!ic || !ic.width) continue;
      const t = new THREE.CanvasTexture(ic);
      t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
      p.mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(0.32, 0.32),
        new THREE.MeshBasicMaterial({ map: t, transparent: true, alphaTest: 0.5, side: THREE.DoubleSide })
      );
      scene.add(p.mesh);
    }
    p.mesh.position.set(p.px + (p.x - p.px) * al, p.py + (p.y - p.py) * al, p.pz + (p.z - p.pz) * al);
    p.mesh.quaternion.copy(cam.quaternion);
  }
}

// 盾の防御判定＆hurtPlayer 拡張
function hasShieldEquipped() {
  if (getItemCd('shield') > 0) return false;
  const main = hotbar[sel];
  return (main && main.k === 'shield') || (off && off.k === 'shield');
}

function canBlockFrom(srcPos) {
  if (!shieldBlocking || !hasShieldEquipped()) return false;
  if (!srcPos) return true;
  const dx = srcPos[0] - P.x, dz = srcPos[2] - P.z;
  const len = Math.hypot(dx, dz);
  if (len < 1e-4) return true;
  const yr = P.yaw * Math.PI / 180;
  const fx = -Math.sin(yr), fz = Math.cos(yr);
  return (fx * (dx / len) + fz * (dz / len)) > 0;
}

function damageShield(amount) {
  const main = hotbar[sel];
  if (main && main.k === 'shield') useDur(hotbar, sel, amount);
  else if (off && off.k === 'shield') {
    const arr = [off];
    useDur(arr, 0, amount);
    off = arr[0];
  }
}

const _origHurtPlayer = hurtPlayer;
hurtPlayer = function(d, pierce, srcPos, attacker) {
  if (gm !== 'survival' || P.hp <= 0) return false;
  if (!pierce && canBlockFrom(srcPos)) {
    playSound('item.shield.block', 1, 0.8 + Math.random() * 0.4);
    damageShield(1 + Math.floor(d));
    if (attacker) {
      const dx = attacker.x - P.x, dz = attacker.z - P.z, l = Math.hypot(dx, dz) || 1;
      attacker.vx += (dx / l) * 0.5;
      attacker.vz += (dz / l) * 0.5;
      attacker.vy = Math.max(attacker.vy || 0, 0.25);
    }
    return false;
  }
  _origHurtPlayer(d, pierce);
  return true;
};

// 矢の回収（プレイヤー発射の刺さった矢）・クリティカル軌跡・盾反射
const _origArrowTick = arrowTick;
arrowTick = function() {
  for (let i = arrows.length - 1; i >= 0; i--) {
    const a = arrows[i];
    if (a.stuck === 0 && a.crit && (a.age % 2 === 0)) {
      spawnImpactParticles(a.x, a.y, a.z, '#ffe875', 1);
    }
    if (a.stuck > 0 && a.fromPlayer && Math.hypot(a.x - P.x, a.z - P.z) < 1.3 && Math.abs(a.y - (P.y + 0.8)) < 1.3) {
      if (gm === 'creative' || giveInv({ k: 'arrow', n: 1 })) {
        playSound('entity.item.pickup', 0.3, 1 + Math.random() * 0.4);
        if (a.mesh) scene.remove(a.mesh);
        arrows.splice(i, 1);
      }
      continue;
    }
    if (a.stuck === 0 && a.shooter !== P && gm === 'survival' && P.hp > 0) {
      const nx = a.x + a.vx, ny = a.y + a.vy, nz = a.z + a.vz;
      if (Math.abs(nx - P.x) < HW + 0.25 && Math.abs(nz - P.z) < HW + 0.25 && ny > P.y && ny < P.y + height()) {
        if (canBlockFrom([a.x, a.y, a.z])) {
          playSound('item.shield.block', 1, 0.8 + Math.random() * 0.4);
          damageShield(1 + Math.floor(a.dmg));
          a.vx *= -0.35; a.vy = 0.15; a.vz *= -0.35; a.shooter = null;
          continue;
        }
      }
    }
  }
  _origArrowTick();
};

// doPlace・doTick・extraTick・animAll・mouseup への統合
const _origDoPlace = doPlace;
doPlace = async function() {
  if (sleepT > 0) return;
  if (interactMob()) return;
  const r = ray();
  if (interactBlock(r)) return;
  const cs = hotbar[sel];
  if (cs && typeof cs.k === 'string') {
    if (cs.k === 'bow') {
      if (gm === 'creative' || findArrowSlot()) {
        if (bowPull === 0) bowPull = 1;
      }
      return;
    }
    if (cs.k === 'shield' && getItemCd('shield') <= 0) {
      shieldBlocking = true;
      return;
    }
    if (cs.k === 'snowball' || cs.k === 'egg' || cs.k === 'ender_pearl') {
      throwProjectile(cs.k, cs);
      return;
    }
  }
  // メインハンドがブロック設置・道具使用でない場合、オフハンドの盾・投擲アイテムを優先判定
  if (off && typeof off.k === 'string') {
    if (off.k === 'shield' && getItemCd('shield') <= 0 && (!cs || typeof cs.k === 'string')) {
      shieldBlocking = true;
      return;
    }
  }
  await _origDoPlace();
};

addEventListener('mouseup', e => {
  if (e.button === 2) {
    if (bowPull > 0) releaseBow();
    shieldBlocking = false;
  }
});

const _origDoTick = doTick;
doTick = function() {
  for (const [k, v] of itemCooldowns) {
    if (v <= 1) itemCooldowns.delete(k);
    else itemCooldowns.set(k, v - 1);
  }
  const cs = hotbar[sel];
  if (bowPull > 0) {
    if (!mb[2] || invOpen || !cs || cs.k !== 'bow') bowPull = 0;
    else { bowPull++; P.sprint = false; }
  }
  if (shieldBlocking) {
    if (!mb[2] || invOpen || !hasShieldEquipped()) shieldBlocking = false;
    else P.sprint = false;
  }
  _origDoTick();
  if (bowPull > 0) {
    const zoom = Math.min(1, bowPull / 20) * 0.15;
    P.fov += (OPT.fov * (1 - zoom) - P.fov) * 0.35;
  }
};

const _origExtraTick = extraTick;
extraTick = function() {
  _origExtraTick();
  projTick();
};

// 一人称視点の弓引き絞り・3D盾（メイン＆オフハンド）描画拡張
const _origAnimAll = animAll;
animAll = function(al) {
  projMeshes(al);
  const cs = hotbar[sel];
  if (cs && cs.k === 'bow') {
    const stage = bowPull >= 18 ? 'bow_pulling_2' : bowPull >= 13 ? 'bow_pulling_1' : bowPull > 0 ? 'bow_pulling_0' : 'bow';
    if (stage !== 'bow' && icache[stage] === undefined) {
      icache[stage] = false;
      rawImg('textures/item/' + stage + '.png').then(i => { icache[stage] = i || document.createElement('canvas'); });
    }
    const wantSig = 'bow|' + stage + '|' + (icache[stage] ? 1 : 0);
    if (wantSig !== heldSig) {
      heldSig = wantSig;
      if (heldM) { handG.remove(heldM); heldM = null; }
      const ic = icache[stage] || iconOf('bow');
      if (ic && ic.width) {
        const t = new THREE.CanvasTexture(ic); t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
        const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: t, transparent: true, alphaTest: 0.5, side: THREE.DoubleSide }));
        m.renderOrder = 1000; m.matrixAutoUpdate = false;
        heldM = m; heldD = (dcache['bow'] && dcache['bow'].fp) || { rotation: [0, -90, 25], translation: [1.13, 3.2, 1.13], scale: [0.68, 0.68, 0.68] };
        handG.add(m);
      }
    }
  } else if (cs && cs.k === 'shield') {
    ensureShieldTex();
    const wantSig = 'shield|' + (shieldTexInfo ? 1 : 0);
    if (wantSig !== heldSig) {
      heldSig = wantSig;
      if (heldM) { handG.remove(heldM); heldM = null; }
      const sm = createShield3D();
      sm.renderOrder = 1000; sm.matrixAutoUpdate = false;
      heldM = sm; heldD = null;
      handG.add(sm);
    }
  }

  _origAnimAll(al);

  // 弓引き絞り時の振動・引き寄せオフセット
  if (cs && cs.k === 'bow' && heldM && bowPull > 0) {
    const f = Math.min(1, bowPull / 20);
    const vib = bowPull >= 20 ? Math.sin((tick + al) * 1.8) * 0.012 : 0;
    heldM.matrix.premultiply(mT(-f * 0.06, -f * 0.04 + vib, f * 0.14));
  }
  // メインハンド盾の構え姿勢
  if (cs && cs.k === 'shield' && heldM) {
    const blk = shieldBlocking ? 1 : 0;
    heldM.matrix.copy(chain(
      mT(0.42 - blk * 0.26, -0.36 + blk * 0.08, -0.68 + blk * 0.08),
      mR('y', 165 - blk * 15),
      mR('z', -8 + blk * 12)
    ));
  }
  // オフハンドの盾表示（左手側）
  if (!offHandGroup && handG) { offHandGroup = new THREE.Group(); handG.add(offHandGroup); }
  const osg = off && off.k === 'shield' ? 'shield|' + (shieldTexInfo ? 1 : 0) : '';
  if (osg !== offSig) {
    offSig = osg;
    while (offHandGroup.children.length) offHandGroup.remove(offHandGroup.children[0]);
    if (off && off.k === 'shield') {
      ensureShieldTex();
      const osm = createShield3D();
      osm.renderOrder = 1000; osm.matrixAutoUpdate = false;
      offHandGroup.add(osm);
    }
  }
  if (offHandGroup && offHandGroup.children[0]) {
    const blk = shieldBlocking ? 1 : 0;
    offHandGroup.children[0].matrix.copy(chain(
      mT(-0.42 + blk * 0.26, -0.36 + blk * 0.08, -0.68 + blk * 0.08),
      mR('y', -165 + blk * 15),
      mR('z', 8 - blk * 12)
    ));
  }
};

// ワールドリセット時の状態クリア
const _origResetPlayerState = resetPlayerState;
resetPlayerState = function(mode) {
  bowPull = 0; shieldBlocking = false;
  itemCooldowns.clear();
  for (const p of projectiles.splice(0)) if (p.mesh) scene.remove(p.mesh);
  _origResetPlayerState(mode);
};


// ===== 第5弾アップデート：チャット＆コマンド・レシピブック・ドロップ合体/吸引・経験値オーブ =====
(() => {
  // ---- 1. アセット読み込み（経験値バー・経験値オーブ） ----
  const XP_TEX = { bg: null, fg: null, orb: null };
  (async () => {
    try {
      if (typeof rawImg === 'function') {
        XP_TEX.bg = await rawImg('textures/gui/sprites/hud/experience_bar_background.png');
        XP_TEX.fg = await rawImg('textures/gui/sprites/hud/experience_bar_progress.png');
        const orbImg = await rawImg('textures/entity/experience_orb.png');
        if (orbImg) {
          const t = new THREE.CanvasTexture(orbImg);
          t.magFilter = t.minFilter = THREE.NearestFilter;
          t.generateMipmaps = false;
          XP_TEX.orb = t;
        }
      }
    } catch (e) {}
  })();

  // ---- 2. チャット＆コマンドシステム（Tキー / '/'キー） ----
  let chatOpen = false;
  let chatInput = '';
  let chatCursor = 0;
  const chatLogs = []; // { text, color, time }
  const chatHistory = [];
  let chatHistIdx = -1;
  let tabMatches = [];
  let tabIndex = 0;

  function addChatMessage(text, color = '#ffffff') {
    chatLogs.push({ text: String(text), color, time: tick });
    if (chatLogs.length > 50) chatLogs.shift();
  }
  window.addChatMessage = addChatMessage;

  function openChat(initial = '') {
    if (titleOn || invOpen || screen === 'dead') return;
    chatOpen = true;
    chatInput = initial;
    chatCursor = initial.length;
    chatHistIdx = -1;
    tabMatches = [];
    for (const k in K) K[k] = 0;
    mb = [0, 0, 0];
    if (document.pointerLockElement) document.exitPointerLock();
  }

  function closeChat(refocus = true) {
    chatOpen = false;
    chatInput = '';
    chatCursor = 0;
    tabMatches = [];
    if (refocus && !invOpen && !titleOn && screen !== 'dead') {
      try { lockPtr(); } catch (e) {}
    }
  }

  const CMD_LIST = ['/gamemode', '/time', '/weather', '/tp', '/give', '/summon', '/kill', '/seed', '/help'];

  function allItemNames() {
    const set = new Set();
    for (let i = 1; i < B.length; i++) if (B[i] && B[i].n) set.add(B[i].n);
    for (const it of ITEMS) set.add(it);
    return [...set].sort();
  }

  function parseCoord(token, base) {
    if (token === '~') return base;
    if (token.startsWith('~')) {
      const d = parseFloat(token.slice(1));
      return Number.isFinite(d) ? base + d : NaN;
    }
    return parseFloat(token);
  }

  async function runCommand(raw) {
    const line = raw.trim();
    if (!line) return;
    if (chatHistory[chatHistory.length - 1] !== line) chatHistory.push(line);
    if (!line.startsWith('/')) {
      addChatMessage('<Player> ' + line, '#ffffff');
      return;
    }
    const args = line.slice(1).trim().split(/\s+/);
    const cmd = (args[0] || '').toLowerCase();

    if (cmd === 'help') {
      addChatMessage('利用可能コマンド: /gamemode, /time, /weather, /tp, /give, /summon, /kill, /seed', '#ffff55');
      return;
    }

    if (cmd === 'seed') {
      addChatMessage('Seed: [' + (SEED | 0) + ']', '#55ff55');
      return;
    }

    if (cmd === 'gamemode') {
      const m = (args[1] || '').toLowerCase();
      if (m === 'creative' || m === 'c' || m === '1') {
        setGM('creative');
        addChatMessage('ゲームモードをクリエイティブに設定しました', '#aaaaaa');
      } else if (m === 'survival' || m === 's' || m === '0') {
        setGM('survival');
        addChatMessage('ゲームモードをサバイバルに設定しました', '#aaaaaa');
      } else {
        addChatMessage('使用法: /gamemode <creative|survival>', '#ff5555');
      }
      return;
    }

    if (cmd === 'time') {
      const sub = (args[1] || '').toLowerCase();
      const val = (args[2] || '').toLowerCase();
      const presets = { day: 1000, noon: 6000, sunset: 12000, night: 13000, midnight: 18000 };
      if (sub === 'set') {
        const t = val in presets ? presets[val] : parseInt(val, 10);
        if (Number.isFinite(t) && t >= 0) {
          dayT = t % 24000;
          addChatMessage('時間を ' + dayT + ' に設定しました', '#aaaaaa');
        } else {
          addChatMessage('使用法: /time set <day|noon|night|midnight|数値>', '#ff5555');
        }
      } else if (sub === 'add') {
        const t = parseInt(val, 10);
        if (Number.isFinite(t)) {
          dayT = ((dayT + t) % 24000 + 24000) % 24000;
          addChatMessage('時間を ' + t + ' 進めました（現在: ' + dayT + '）', '#aaaaaa');
        } else {
          addChatMessage('使用法: /time add <数値>', '#ff5555');
        }
      } else {
        addChatMessage('現在時刻: ' + dayT + ' tick', '#aaaaaa');
      }
      return;
    }

    if (cmd === 'weather') {
      const w = (args[1] || '').toLowerCase();
      if (w === 'clear' || w === 'rain' || w === 'thunder') {
        weather = w;
        wTimer = 6000 + Math.floor(Math.random() * 6000);
        addChatMessage('天候を ' + w + ' に変更しました', '#aaaaaa');
      } else {
        addChatMessage('使用法: /weather <clear|rain|thunder>', '#ff5555');
      }
      return;
    }

    if (cmd === 'tp') {
      if (args.length < 4) {
        addChatMessage('使用法: /tp <x> <y> <z>', '#ff5555');
        return;
      }
      const nx = parseCoord(args[1], P.x);
      const ny = parseCoord(args[2], P.y);
      const nz = parseCoord(args[3], P.z);
      if (![nx, ny, nz].every(Number.isFinite)) {
        addChatMessage('無効な座標です', '#ff5555');
        return;
      }
      P.x = P.px = Math.max(1, Math.min(W - 2, nx));
      P.y = P.py = Math.max(1, Math.min(H + 20, ny));
      P.z = P.pz = Math.max(1, Math.min(W - 2, nz));
      P.vx = P.vy = P.vz = P.fall = 0;
      addChatMessage(`プレイヤーを ${P.x.toFixed(1)}, ${P.y.toFixed(1)}, ${P.z.toFixed(1)} にテレポートしました`, '#aaaaaa');
      return;
    }

    if (cmd === 'give') {
      const rawName = (args[1] || '').replace(/^minecraft:/, '').toLowerCase();
      const count = Math.max(1, Math.min(2304, parseInt(args[2] || '1', 10) || 1));
      if (!rawName) {
        addChatMessage('使用法: /give <アイテムID> [個数]', '#ff5555');
        return;
      }
      let k = resolveItem(rawName);
      if (k === null && typeof addBlock === 'function') {
        try {
          await addBlock(rawName);
          if (typeof rebuildBI === 'function') rebuildBI();
          if (typeof buildIcons === 'function') buildIcons();
          k = resolveItem(rawName);
        } catch (e) {}
      }
      if (k === null || k === undefined) {
        addChatMessage('不明なアイテム: ' + rawName, '#ff5555');
        return;
      }
      let rem = count;
      const mx = maxStack(k);
      while (rem > 0) {
        const giveN = Math.min(mx, rem);
        const it = { k, n: giveN };
        if (!giveInv(it)) spawnDrop(it, P.x, P.y + 0.5, P.z, 0, 0.1, 0, 0);
        rem -= giveN;
      }
      playSound('entity.item.pickup', 0.35, 1.1);
      addChatMessage(`[${pretty(k)}] を ${count} 個付与しました`, '#aaaaaa');
      return;
    }

    if (cmd === 'summon') {
      const mobType = (args[1] || '').replace(/^minecraft:/, '').toLowerCase();
      if (!mobType || typeof MOB_DEFS === 'undefined' || !MOB_DEFS[mobType]) {
        const valid = typeof MOB_DEFS !== 'undefined' ? Object.keys(MOB_DEFS).join(', ') : '';
        addChatMessage('使用法: /summon <' + valid + '> [x] [y] [z]', '#ff5555');
        return;
      }
      const sx = args[2] !== undefined ? parseCoord(args[2], P.x) : P.x + 1.5;
      const sy = args[3] !== undefined ? parseCoord(args[3], P.y) : P.y;
      const sz = args[4] !== undefined ? parseCoord(args[4], P.z) : P.z + 1.5;
      if (![sx, sy, sz].every(Number.isFinite)) {
        addChatMessage('無効な座標です', '#ff5555');
        return;
      }
      spawnMob(mobType, sx, sy, sz);
      addChatMessage(`新しい ${mobType} を召喚しました`, '#aaaaaa');
      return;
    }

    if (cmd === 'kill') {
      const target = (args[1] || '@s').toLowerCase();
      if (target === '@e') {
        let cnt = 0;
        if (typeof mobs !== 'undefined') {
          for (const m of mobs) {
            if (m.dead <= 0) { m.hp = 0; m.dead = 20; cnt++; }
          }
        }
        for (const d of drops) { if (!d.dead) { d.dead = true; cnt++; } }
        addChatMessage(`${cnt} 体のエンティティをキルしました`, '#aaaaaa');
      } else {
        P.hp = 0;
        addChatMessage('プレイヤーは力尽きた', '#ff5555');
      }
      return;
    }

    addChatMessage('不明なコマンドです: /' + cmd + ' （/help で一覧表示）', '#ff5555');
  }

  function handleTabComplete() {
    const parts = chatInput.split(/\s+/);
    if (parts.length <= 1) {
      const prefix = parts[0] || '/';
      if (!tabMatches.length) {
        tabMatches = CMD_LIST.filter(c => c.startsWith(prefix.toLowerCase()));
        tabIndex = 0;
      }
      if (tabMatches.length) {
        chatInput = tabMatches[tabIndex % tabMatches.length] + ' ';
        chatCursor = chatInput.length;
        tabIndex++;
      }
    } else if (parts[0] === '/give' && parts.length === 2) {
      const q = parts[1].toLowerCase();
      if (!tabMatches.length) {
        tabMatches = allItemNames().filter(n => n.startsWith(q)).slice(0, 30);
        tabIndex = 0;
      }
      if (tabMatches.length) {
        chatInput = '/give ' + tabMatches[tabIndex % tabMatches.length] + ' ';
        chatCursor = chatInput.length;
        tabIndex++;
      }
    } else if (parts[0] === '/summon' && parts.length === 2 && typeof MOB_DEFS !== 'undefined') {
      const q = parts[1].toLowerCase();
      if (!tabMatches.length) {
        tabMatches = Object.keys(MOB_DEFS).filter(n => n.startsWith(q));
        tabIndex = 0;
      }
      if (tabMatches.length) {
        chatInput = '/summon ' + tabMatches[tabIndex % tabMatches.length] + ' ';
        chatCursor = chatInput.length;
        tabIndex++;
      }
    } else if (parts[0] === '/gamemode' && parts.length === 2) {
      const q = parts[1].toLowerCase();
      if (!tabMatches.length) {
        tabMatches = ['creative', 'survival'].filter(n => n.startsWith(q));
        tabIndex = 0;
      }
      if (tabMatches.length) {
        chatInput = '/gamemode ' + tabMatches[tabIndex % tabMatches.length];
        chatCursor = chatInput.length;
        tabIndex++;
      }
    } else if (parts[0] === '/weather' && parts.length === 2) {
      const q = parts[1].toLowerCase();
      if (!tabMatches.length) {
        tabMatches = ['clear', 'rain', 'thunder'].filter(n => n.startsWith(q));
        tabIndex = 0;
      }
      if (tabMatches.length) {
        chatInput = '/weather ' + tabMatches[tabIndex % tabMatches.length];
        chatCursor = chatInput.length;
        tabIndex++;
      }
    } else if (parts[0] === '/time' && parts.length === 2) {
      const q = parts[1].toLowerCase();
      if (!tabMatches.length) {
        tabMatches = ['set', 'add'].filter(n => n.startsWith(q));
        tabIndex = 0;
      }
      if (tabMatches.length) {
        chatInput = '/time ' + tabMatches[tabIndex % tabMatches.length] + ' ';
        chatCursor = chatInput.length;
        tabIndex++;
      }
    }
  }

  // ---- 3. クラフト画面の「レシピブック（作成可能一覧）」 ----
  let recipeBookOpen = false;
  let rbCraftableOnly = true;
  let rbPage = 0;
  let rbSearch = '';
  let rbSearchFocus = false;

  // キャプチャフェーズでチャット入力＆レシピブック検索入力を制御
  addEventListener('keydown', (e) => {
    if (titleOn || listenKey) return;

    if (chatOpen) {
      e.preventDefault();
      e.stopImmediatePropagation();
      if (e.code === 'Escape') {
        closeChat(true);
        return;
      }
      if (e.code === 'Enter' || e.code === 'NumpadEnter') {
        const text = chatInput;
        closeChat(true);
        runCommand(text);
        return;
      }
      if (e.code === 'Tab') {
        handleTabComplete();
        return;
      }
      tabMatches = [];
      if (e.code === 'Backspace') {
        if (chatCursor > 0) {
          chatInput = chatInput.slice(0, chatCursor - 1) + chatInput.slice(chatCursor);
          chatCursor--;
        }
        return;
      }
      if (e.code === 'Delete') {
        if (chatCursor < chatInput.length) {
          chatInput = chatInput.slice(0, chatCursor + 1);
        }
        return;
      }
      if (e.code === 'ArrowLeft') {
        chatCursor = Math.max(0, chatCursor - 1);
        return;
      }
      if (e.code === 'ArrowRight') {
        chatCursor = Math.min(chatInput.length, chatCursor + 1);
        return;
      }
      if (e.code === 'ArrowUp') {
        if (chatHistory.length) {
          if (chatHistIdx < 0) chatHistIdx = chatHistory.length - 1;
          else chatHistIdx = Math.max(0, chatHistIdx - 1);
          chatInput = chatHistory[chatHistIdx];
          chatCursor = chatInput.length;
        }
        return;
      }
      if (e.code === 'ArrowDown') {
        if (chatHistIdx >= 0) {
          chatHistIdx++;
          if (chatHistIdx >= chatHistory.length) {
            chatHistIdx = -1;
            chatInput = '';
          } else {
            chatInput = chatHistory[chatHistIdx];
          }
          chatCursor = chatInput.length;
        }
        return;
      }
      if (e.key && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
        chatInput = chatInput.slice(0, chatCursor) + e.key + chatInput.slice(chatCursor);
        chatCursor++;
      }
      return;
    }

    // レシピブック検索欄フォーカス中の文字入力
    if (invOpen && (screen === 'surv' || screen === 'craft') && recipeBookOpen && rbSearchFocus) {
      if (e.code === 'Escape' || e.code === 'Enter') {
        rbSearchFocus = false;
        e.preventDefault();
        e.stopImmediatePropagation();
        return;
      }
      if (e.code === 'Backspace') {
        rbSearch = rbSearch.slice(0, -1);
        rbPage = 0;
        e.preventDefault();
        e.stopImmediatePropagation();
        return;
      }
      if (e.key && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
        rbSearch += e.key;
        rbPage = 0;
        e.preventDefault();
        e.stopImmediatePropagation();
        return;
      }
    }

    if (!invOpen && screen !== 'dead') {
      if (e.code === KEYS.chat && !e.repeat) {
        e.preventDefault();
        e.stopImmediatePropagation();
        openChat('');
        return;
      }
      if ((e.key === '/' || e.code === 'Slash') && !e.repeat) {
        e.preventDefault();
        e.stopImmediatePropagation();
        openChat('/');
        return;
      }
    }
  }, true);

  // チャット開放中・レシピブック開放中のホイール制御
  addEventListener('wheel', (e) => {
    if (chatOpen) {
      e.preventDefault();
      e.stopImmediatePropagation();
      return;
    }
    if (invOpen && (screen === 'surv' || screen === 'craft') && recipeBookOpen) {
      const gridSize = screen === 'surv' ? 2 : 3;
      const L = rbLayout(gridSize);
      if (uiM.x >= L.panelX && uiM.x < L.panelX + L.panelW && uiM.y >= L.panelY && uiM.y < L.panelY + L.panelH) {
        const list = getFilteredRecipes(gridSize);
        const maxPage = Math.max(0, Math.ceil(list.length / 20) - 1);
        rbPage = Math.max(0, Math.min(maxPage, rbPage + Math.sign(e.deltaY)));
        e.preventDefault();
        e.stopImmediatePropagation();
      }
    }
  }, { capture: true, passive: false });

  // チャット開放中にポーズメニューが開くのを抑止
  const _origOpenScreen = openScreen;
  openScreen = function(s) {
    if (chatOpen && s === 'menu') return;
    _origOpenScreen(s);
  };

  function drawChatUI(g) {
    const visibleLogs = chatOpen
      ? chatLogs.slice(-10)
      : chatLogs.filter(l => tick - l.time < 200).slice(-6);

    const baseY = GH - 48;
    for (let i = 0; i < visibleLogs.length; i++) {
      const log = visibleLogs[visibleLogs.length - 1 - i];
      const age = tick - log.time;
      const alpha = chatOpen ? 0.65 : Math.max(0, Math.min(0.65, (200 - age) / 30 * 0.65));
      if (alpha <= 0.01) continue;
      const y = baseY - i * 11;
      const w = Math.min(GW - 16, Math.max(120, tw(log.text) + 8));
      g.fillStyle = `rgba(0,0,0,${alpha.toFixed(2)})`;
      g.fillRect(4, y - 1, w, 10);
      txt(g, log.text, 7, y, log.color, true);
    }

    if (chatOpen) {
      const iy = GH - 14;
      g.fillStyle = 'rgba(0,0,0,0.78)';
      g.fillRect(4, iy, GW - 8, 12);
      g.strokeStyle = '#666';
      g.strokeRect(4.5, iy + 0.5, GW - 9, 11);
      const before = chatInput.slice(0, chatCursor);
      const caret = (Math.floor(performance.now() / 450) % 2 === 0) ? '_' : '';
      const disp = before + caret + chatInput.slice(chatCursor);
      txt(g, disp, 7, iy + 2, '#ffffff', true);
    }
  }

  function getInvCounts() {
    const counts = new Map();
    const add = (s) => {
      if (!s) return;
      const nm = typeof s.k === 'number' ? (B[s.k] && B[s.k].n) : s.k;
      if (nm) counts.set(nm, (counts.get(nm) || 0) + s.n);
    };
    for (const s of hotbar) add(s);
    for (const s of craft2) add(s);
    for (const s of craft3) add(s);
    return counts;
  }

  function maxCraftableTimes(rec, gridSize, invCounts) {
    if (rec.t === 1 && (rec.w > gridSize || rec.h > gridSize)) return 0;
    const reqSets = rec.t === 0 ? rec.ings : rec.grid.filter(Boolean);
    if (!reqSets.length) return 0;
    const pool = new Map(invCounts);
    let times = 0;
    while (times < 64) {
      let ok = true;
      for (const st of reqSets) {
        let picked = null;
        for (const cand of st) {
          if ((pool.get(cand) || 0) > 0) { picked = cand; break; }
        }
        if (!picked) { ok = false; break; }
        pool.set(picked, pool.get(picked) - 1);
      }
      if (!ok) break;
      times++;
    }
    return times;
  }

  function getFilteredRecipes(gridSize) {
    const invCounts = getInvCounts();
    const q = rbSearch.trim().toLowerCase();
    const list = [];
    for (const r of RECIPES) {
      if (r.t === 1 && (r.w > gridSize || r.h > gridSize)) continue;
      const outK = resolveItem(r.rn);
      if (outK === null || outK === undefined) continue;
      if (q && !r.rn.includes(q) && !pretty(outK).toLowerCase().includes(q)) continue;
      const times = maxCraftableTimes(r, gridSize, invCounts);
      if (rbCraftableOnly && times <= 0) continue;
      list.push({ rec: r, outK, times });
    }
    list.sort((a, b) => (b.times > 0) - (a.times > 0) || a.rec.rn.localeCompare(b.rec.rn));
    return list;
  }

  function returnGridToInv(gridArr) {
    for (let i = 0; i < gridArr.length; i++) {
      if (gridArr[i]) {
        if (!giveInv(gridArr[i])) throwItem(gridArr[i]);
        gridArr[i] = null;
      }
    }
  }

  function takeOneIngredient(ingSet) {
    for (let i = 0; i < 36; i++) {
      const s = hotbar[i];
      if (!s) continue;
      const nm = typeof s.k === 'number' ? (B[s.k] && B[s.k].n) : s.k;
      if (nm && ingSet.has(nm)) {
        const res = { k: s.k, n: 1, d: s.d };
        s.n--;
        if (s.n <= 0) hotbar[i] = null;
        return res;
      }
    }
    return null;
  }

  function placeRecipeIntoGrid(rec, gridSize, fillMax) {
    const gridArr = gridSize === 2 ? craft2 : craft3;
    returnGridToInv(gridArr);

    const invCounts = getInvCounts();
    const avail = maxCraftableTimes(rec, gridSize, invCounts);
    if (avail <= 0) return;
    const maxTimes = Math.max(1, Math.min(fillMax ? 64 : 1, avail));

    for (let t = 0; t < maxTimes; t++) {
      if (rec.t === 0) {
        for (let idx = 0; idx < rec.ings.length; idx++) {
          const item = takeOneIngredient(rec.ings[idx]);
          if (!item) break;
          if (!gridArr[idx]) gridArr[idx] = item;
          else if (gridArr[idx].k === item.k && gridArr[idx].n < maxStack(item.k)) gridArr[idx].n++;
          else { giveInv(item); break; }
        }
      } else {
        for (let ry = 0; ry < rec.h; ry++) {
          for (let rx = 0; rx < rec.w; rx++) {
            const need = rec.grid[ry * rec.w + rx];
            if (!need) continue;
            const slotIdx = ry * gridSize + rx;
            const item = takeOneIngredient(need);
            if (!item) break;
            if (!gridArr[slotIdx]) gridArr[slotIdx] = item;
            else if (gridArr[slotIdx].k === item.k && gridArr[slotIdx].n < maxStack(item.k)) gridArr[slotIdx].n++;
            else { giveInv(item); break; }
          }
        }
      }
    }
    if (gridSize === 2) updateCraft2();
    else updateCraft3();
    playSound('ui.button.click', 0.35, 1.15);
  }

  function rbLayout(gridSize) {
    const gx = SVX(), gy = SVY();
    const btnX = gridSize === 2 ? gx + 104 : gx + 5;
    const btnY = gridSize === 2 ? gy + 61 : gy + 34;
    const panelW = 116, panelH = 166;
    const panelX = Math.max(2, gx - panelW - 4);
    const panelY = gy;
    return { btnX, btnY, panelX, panelY, panelW, panelH };
  }

  function drawRecipeBook(g, gridSize) {
    const L = rbLayout(gridSize);
    // 緑の本ボタン
    const hovBtn = uiM.x >= L.btnX && uiM.x < L.btnX + 20 && uiM.y >= L.btnY && uiM.y < L.btnY + 18;
    g.fillStyle = hovBtn ? '#55aa55' : '#3b7a3b';
    g.fillRect(L.btnX, L.btnY, 20, 18);
    g.strokeStyle = recipeBookOpen ? '#ffff55' : '#1e461e';
    g.strokeRect(L.btnX + 0.5, L.btnY + 0.5, 19, 17);
    g.fillStyle = '#c89d54';
    g.fillRect(L.btnX + 5, L.btnY + 3, 10, 12);
    g.fillStyle = '#f5f0dc';
    g.fillRect(L.btnX + 6, L.btnY + 4, 8, 10);
    g.fillStyle = '#3b7a3b';
    g.fillRect(L.btnX + 9, L.btnY + 4, 2, 10);

    if (!recipeBookOpen) return;

    // パネル本体
    g.fillStyle = '#c6c6c6';
    g.fillRect(L.panelX, L.panelY, L.panelW, L.panelH);
    g.strokeStyle = '#373737';
    g.strokeRect(L.panelX + 0.5, L.panelY + 0.5, L.panelW - 1, L.panelH - 1);

    txt(g, 'Recipe Book', L.panelX + 6, L.panelY + 6, '#404040', false);

    // 検索入力ボックス
    const sx0 = L.panelX + 6, sy0 = L.panelY + 17, sw0 = L.panelW - 12, sh0 = 13;
    g.fillStyle = '#202020';
    g.fillRect(sx0, sy0, sw0, sh0);
    g.strokeStyle = rbSearchFocus ? '#ffff55' : '#808080';
    g.strokeRect(sx0 + 0.5, sy0 + 0.5, sw0 - 1, sh0 - 1);
    const caret = (rbSearchFocus && Math.floor(performance.now() / 450) % 2 === 0) ? '_' : '';
    if (rbSearch || rbSearchFocus) {
      txt(g, rbSearch + caret, sx0 + 3, sy0 + 3, '#ffffff', false);
    } else {
      txt(g, 'Search...', sx0 + 3, sy0 + 3, '#888888', false);
    }

    // フィルター切替ボタン（作成可能のみ / すべて）
    const fx = L.panelX + 6, fy = L.panelY + 33, fw = L.panelW - 12, fh = 13;
    const hovF = uiM.x >= fx && uiM.x < fx + fw && uiM.y >= fy && uiM.y < fy + fh;
    g.fillStyle = rbCraftableOnly ? (hovF ? '#4c994c' : '#3b7a3b') : (hovF ? '#888' : '#6e6e6e');
    g.fillRect(fx, fy, fw, fh);
    const flabel = rbCraftableOnly ? 'Craftable: ON' : 'Craftable: ALL';
    txt(g, flabel, fx + ((fw - tw(flabel)) >> 1), fy + 3, '#ffffff', true);

    const list = getFilteredRecipes(gridSize);
    const cols = 5, rows = 4, perPage = cols * rows;
    const maxPage = Math.max(0, Math.ceil(list.length / perPage) - 1);
    rbPage = Math.max(0, Math.min(rbPage, maxPage));

    let hovItem = null;
    for (let idx = 0; idx < perPage; idx++) {
      const entry = list[rbPage * perPage + idx];
      const sx = L.panelX + 8 + (idx % cols) * 20;
      const sy = L.panelY + 50 + Math.floor(idx / cols) * 20;
      g.fillStyle = entry ? (entry.times > 0 ? '#8b8b8b' : '#7a4b4b') : '#666666';
      g.fillRect(sx, sy, 18, 18);
      g.strokeStyle = entry && entry.times > 0 ? '#ffffff' : '#552222';
      g.strokeRect(sx + 0.5, sy + 0.5, 17, 17);
      if (entry) {
        put(g, entry.outK, sx + 1, sy + 1);
        if (entry.rec.rc > 1) {
          const ct = String(entry.rec.rc);
          txt(g, ct, sx + 17 - tw(ct), sy + 9);
        }
        if (uiM.x >= sx && uiM.x < sx + 18 && uiM.y >= sy && uiM.y < sy + 18) {
          g.fillStyle = 'rgba(255,255,255,0.45)';
          g.fillRect(sx + 1, sy + 1, 16, 16);
          hovItem = entry;
        }
      }
    }

    // ページ送り
    const py = L.panelY + 138;
    const pTxt = `${rbPage + 1}/${maxPage + 1}`;
    txt(g, '<', L.panelX + 14, py + 2, rbPage > 0 ? '#202020' : '#888', false);
    txt(g, pTxt, L.panelX + ((L.panelW - tw(pTxt)) >> 1), py + 2, '#404040', false);
    txt(g, '>', L.panelX + L.panelW - 20, py + 2, rbPage < maxPage ? '#202020' : '#888', false);

    if (hovItem && !cursor) {
      const label = pretty(hovItem.outK) + (hovItem.times > 0 ? ` (${hovItem.times}回分可能)` : ' (素材不足)');
      const w = tw(label);
      g.fillStyle = 'rgba(16,0,16,.94)';
      g.fillRect(uiM.x + 9, uiM.y - 14, w + 6, 12);
      g.strokeStyle = '#5000a0';
      g.strokeRect(uiM.x + 9.5, uiM.y - 13.5, w + 5, 11);
      txt(g, label, uiM.x + 12, uiM.y - 12);
    }
  }

  function handleRecipeBookClick(gridSize, shift) {
    const L = rbLayout(gridSize);
    if (uiM.x >= L.btnX && uiM.x < L.btnX + 20 && uiM.y >= L.btnY && uiM.y < L.btnY + 18) {
      recipeBookOpen = !recipeBookOpen;
      rbSearchFocus = false;
      rbPage = 0;
      playSound('ui.button.click', 0.5, 1);
      return true;
    }
    if (!recipeBookOpen) return false;

    const sx0 = L.panelX + 6, sy0 = L.panelY + 17, sw0 = L.panelW - 12, sh0 = 13;
    if (uiM.x >= sx0 && uiM.x < sx0 + sw0 && uiM.y >= sy0 && uiM.y < sy0 + sh0) {
      rbSearchFocus = true;
      return true;
    } else {
      rbSearchFocus = false;
    }

    const fx = L.panelX + 6, fy = L.panelY + 33, fw = L.panelW - 12, fh = 13;
    if (uiM.x >= fx && uiM.x < fx + fw && uiM.y >= fy && uiM.y < fy + fh) {
      rbCraftableOnly = !rbCraftableOnly;
      rbPage = 0;
      playSound('ui.button.click', 0.5, 1);
      return true;
    }

    const list = getFilteredRecipes(gridSize);
    const cols = 5, rows = 4, perPage = cols * rows;
    const maxPage = Math.max(0, Math.ceil(list.length / perPage) - 1);

    for (let idx = 0; idx < perPage; idx++) {
      const entry = list[rbPage * perPage + idx];
      if (!entry) continue;
      const sx = L.panelX + 8 + (idx % cols) * 20;
      const sy = L.panelY + 50 + Math.floor(idx / cols) * 20;
      if (uiM.x >= sx && uiM.x < sx + 18 && uiM.y >= sy && uiM.y < sy + 18) {
        if (entry.times > 0) placeRecipeIntoGrid(entry.rec, gridSize, shift);
        else playSound('ui.button.click', 0.3, 0.6);
        return true;
      }
    }

    const py = L.panelY + 135;
    if (uiM.y >= py && uiM.y < py + 18) {
      if (uiM.x >= L.panelX + 6 && uiM.x < L.panelX + 34 && rbPage > 0) {
        rbPage--;
        playSound('ui.button.click', 0.4, 1);
        return true;
      }
      if (uiM.x >= L.panelX + L.panelW - 34 && uiM.x < L.panelX + L.panelW - 6 && rbPage < maxPage) {
        rbPage++;
        playSound('ui.button.click', 0.4, 1);
        return true;
      }
    }

    if (uiM.x >= L.panelX && uiM.x < L.panelX + L.panelW && uiM.y >= L.panelY && uiM.y < L.panelY + L.panelH) {
      return true;
    }
    return false;
  }

  const _origDrawSurv = drawSurv;
  drawSurv = function(g) {
    _origDrawSurv(g);
    drawRecipeBook(g, 2);
  };

  const _origDrawCraft = drawCraft;
  drawCraft = function(g) {
    _origDrawCraft(g);
    drawRecipeBook(g, 3);
  };

  const _origUiClick = uiClick;
  uiClick = function(e) {
    if (screen === 'surv' && handleRecipeBookClick(2, e.shiftKey)) return;
    if (screen === 'craft' && handleRecipeBookClick(3, e.shiftKey)) return;
    _origUiClick(e);
  };

  const _origCloseScreen = closeScreen;
  closeScreen = function() {
    recipeBookOpen = false;
    rbSearchFocus = false;
    _origCloseScreen();
  };

  // ---- 4. ドロップアイテムの合体＆プレイヤー吸い寄せ ----
  const _origDropTick = dropTick;
  dropTick = function() {
    // 1) 近くにある同種アイテム同士を合体（1スタック上限まで・耐久消費品は除外）
    for (let i = 0; i < drops.length; i++) {
      const a = drops[i];
      if (a.dead || a.age < 8 || (a.d && a.d > 0)) continue;
      const mx = maxStack(a.k);
      if (a.n >= mx) continue;
      for (let j = i + 1; j < drops.length; j++) {
        const b = drops[j];
        if (b.dead || b.age < 8 || (b.d && b.d > 0) || a.k !== b.k) continue;
        const dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z;
        if (dx * dx + dy * dy + dz * dz < 1.1) {
          const take = Math.min(mx - a.n, b.n);
          a.n += take;
          b.n -= take;
          a.age = Math.min(a.age, b.age);
          if (b.n <= 0) b.dead = true;
          if (a.n >= mx) break;
        }
      }
    }

    // 2) 回収可能状態かつ一定距離内のアイテムをプレイヤーへ滑らかに吸い寄せ
    if (P.hp > 0) {
      for (const d of drops) {
        if (d.dead || d.delay > 0) continue;
        const dx = P.x - d.x;
        const dy = (P.y + 0.6) - d.y;
        const dz = P.z - d.z;
        const distSq = dx * dx + dy * dy + dz * dz;
        if (distSq < 9.0 && distSq > 0.001) {
          const dist = Math.sqrt(distSq);
          const pull = 0.055 * (1 - dist / 3.0) + 0.015;
          d.vx += (dx / dist) * pull;
          d.vy += (dy / dist) * pull + 0.012;
          d.vz += (dz / dist) * pull;
        }
      }
    }

    _origDropTick();
  };

  // ---- 5. 経験値オーブ・レベル・経験値バー ----
  let xpLevel = 0;
  let xpProgress = 0; // 0.0 .. 1.0
  const xpOrbs = []; // { val, x, y, z, px, py, pz, vx, vy, vz, age, dead, mesh }

  function xpToNextLevel(lv) {
    if (lv >= 30) return 112 + (lv - 30) * 9;
    if (lv >= 15) return 37 + (lv - 15) * 5;
    return 7 + lv * 2;
  }

  function addExperience(pts) {
    if (pts <= 0) return;
    let rem = pts;
    while (rem > 0) {
      const need = xpToNextLevel(xpLevel);
      const curPts = xpProgress * need;
      if (curPts + rem >= need) {
        rem -= (need - curPts);
        xpLevel++;
        xpProgress = 0;
        if (xpLevel % 5 === 0) playSound('entity.player.levelup', 0.7, 1.0);
        else playSound('entity.experience_orb.pickup', 0.45, 1.25);
      } else {
        xpProgress = (curPts + rem) / need;
        rem = 0;
        playSound('entity.experience_orb.pickup', 0.35, 0.8 + Math.random() * 0.4);
      }
    }
  }

  function spawnXPOrbs(x, y, z, totalXP) {
    let rem = Math.floor(totalXP);
    while (rem > 0) {
      const val = rem >= 17 ? 17 : rem >= 7 ? 7 : rem >= 3 ? 3 : 1;
      rem -= val;
      xpOrbs.push({
        val,
        x, y, z,
        px: x, py: y, pz: z,
        vx: (Math.random() - 0.5) * 0.18,
        vy: 0.16 + Math.random() * 0.1,
        vz: (Math.random() - 0.5) * 0.18,
        age: 0,
        dead: false,
        mesh: null
      });
    }
  }

  function xpOrbTick() {
    for (const o of xpOrbs) {
      if (o.dead) continue;
      o.age++;
      if (o.age > 600 || o.y < -10) { o.dead = true; continue; }
      o.px = o.x; o.py = o.y; o.pz = o.z;

      if (P.hp > 0) {
        const dx = P.x - o.x;
        const dy = (P.y + 0.7) - o.y;
        const dz = P.z - o.z;
        const dist = Math.hypot(dx, dy, dz);
        if (dist < 6.0 && dist > 0.001) {
          const pull = 0.07 * (1 - dist / 6.0) + 0.02;
          o.vx += (dx / dist) * pull;
          o.vy += (dy / dist) * pull + 0.015;
          o.vz += (dz / dist) * pull;
        }
        if (dist < 1.1) {
          addExperience(o.val);
          o.dead = true;
          continue;
        }
      }

      const oldHW = HW; HW = 0.12;
      const r = move(o, o.vx, o.vy, o.vz, 0.24);
      HW = oldHW;
      if (r.y) o.vy = 0;
      if (r.x) o.vx = 0;
      if (r.z) o.vz = 0;
      o.vy = (o.vy - 0.035) * 0.96;
      o.vx *= 0.92;
      o.vz *= 0.92;
    }
  }

  function xpOrbMeshes(al) {
    for (let i = xpOrbs.length - 1; i >= 0; i--) {
      const o = xpOrbs[i];
      if (o.dead) {
        if (o.mesh) { scene.remove(o.mesh); o.mesh.geometry.dispose(); o.mesh.material.dispose(); o.mesh = null; }
        xpOrbs.splice(i, 1);
        continue;
      }
      if (!o.mesh) {
        const sz = o.val >= 17 ? 0.34 : o.val >= 7 ? 0.28 : o.val >= 3 ? 0.23 : 0.18;
        const mat = XP_TEX.orb
          ? new THREE.MeshBasicMaterial({ map: XP_TEX.orb, transparent: true, alphaTest: 0.3, color: 0xaaff44 })
          : new THREE.MeshBasicMaterial({ color: 0x7cfc00 });
        if (XP_TEX.orb) {
          const tex = XP_TEX.orb.clone();
          tex.needsUpdate = true;
          tex.repeat.set(0.25, 0.25);
          tex.offset.set(0, 0.75);
          mat.map = tex;
        }
        const m = new THREE.Mesh(new THREE.PlaneGeometry(sz, sz), mat);
        o.mesh = m;
        scene.add(m);
      }
      const pulse = 0.85 + Math.sin((o.age + al) * 0.35) * 0.15;
      o.mesh.position.set(
        o.px + (o.x - o.px) * al,
        o.py + (o.y - o.py) * al + 0.15,
        o.pz + (o.z - o.pz) * al
      );
      o.mesh.scale.set(pulse, pulse, 1);
      o.mesh.quaternion.copy(cam.quaternion);
    }
  }

  // 鉱石採掘時の経験値ドロップ
  const ORE_XP = {
    coal_ore: [0, 2], deepslate_coal_ore: [0, 2],
    diamond_ore: [3, 7], deepslate_diamond_ore: [3, 7],
    emerald_ore: [3, 7], deepslate_emerald_ore: [3, 7],
    lapis_ore: [2, 5], deepslate_lapis_ore: [2, 5],
    redstone_ore: [1, 5], deepslate_redstone_ore: [1, 5],
    nether_quartz_ore: [2, 5], nether_gold_ore: [0, 1]
  };
  const _origBreakBlock = breakBlock;
  breakBlock = function(c) {
    const b = id(c[0], c[1], c[2]);
    const nm = b && B[b] ? B[b].n : '';
    _origBreakBlock(c);
    if (gm === 'survival' && nm in ORE_XP && id(c[0], c[1], c[2]) === 0) {
      const [mn, mx] = ORE_XP[nm];
      const xp = mn + Math.floor(Math.random() * (mx - mn + 1));
      if (xp > 0) spawnXPOrbs(c[0] + 0.5, c[1] + 0.5, c[2] + 0.5, xp);
    }
  };

  // Mob討伐時の経験値ドロップ
  const _origHurtMob = hurtMob;
  hurtMob = function(m, amount, kx = 0, ky = 0, kz = 0) {
    const wasAlive = m && m.dead <= 0 && m.hp > 0;
    _origHurtMob(m, amount, kx, ky, kz);
    if (wasAlive && m.hp <= 0) {
      const xp = m.hostile ? 5 : (1 + Math.floor(Math.random() * 3));
      spawnXPOrbs(m.x, m.y + 0.4, m.z, xp);
    }
  };

  // かまど精錬回収時の経験値付与
  const _origFurnaceClick = furnaceClick;
  furnaceClick = function(b, shift) {
    let outCountBefore = 0;
    let outName = '';
    if (activeBEPos) {
      const be = getBE(...activeBEPos);
      if (be && be.slots && be.slots[2]) {
        outCountBefore = be.slots[2].n;
        const k = be.slots[2].k;
        outName = typeof k === 'number' ? (B[k] && B[k].n) : k;
      }
    }
    _origFurnaceClick(b, shift);
    if (activeBEPos && outCountBefore > 0) {
      const be = getBE(...activeBEPos);
      const outCountAfter = (be && be.slots && be.slots[2]) ? be.slots[2].n : 0;
      const taken = outCountBefore - outCountAfter;
      if (taken > 0) {
        let unitXP = 0.5;
        for (const list of Object.values(SMELT_RECIPES)) {
          const found = list.find(r => r.rn === outName);
          if (found && found.xp > 0) { unitXP = found.xp; break; }
        }
        const total = Math.floor(taken * unitXP) + (Math.random() < ((taken * unitXP) % 1) ? 1 : 0);
        if (total > 0) spawnXPOrbs(P.x, P.y + 0.5, P.z, total);
      }
    }
  };

  // ホットバー上の経験値バー＆レベル描画（体力・空腹バーのY位置を自動調整）
  const _origDrawBars = drawBars;
  drawBars = function(g, hx, hy) {
    if (gm !== 'survival') return;
    const barY = hy - 7;
    if (XP_TEX.bg) {
      g.drawImage(XP_TEX.bg, 0, 0, 182, 5, hx, barY, 182, 5);
    } else {
      g.fillStyle = '#1b2b18';
      g.fillRect(hx, barY, 182, 5);
      g.strokeStyle = '#000';
      g.strokeRect(hx + 0.5, barY + 0.5, 181, 4);
    }
    const fillW = Math.max(0, Math.min(182, Math.round(182 * xpProgress)));
    if (fillW > 0) {
      if (XP_TEX.fg) {
        g.drawImage(XP_TEX.fg, 0, 0, fillW, 5, hx, barY, fillW, 5);
      } else {
        g.fillStyle = '#80ff20';
        g.fillRect(hx + 1, barY + 1, Math.max(0, fillW - 2), 3);
      }
    }
    if (xpLevel > 0) {
      const lvStr = String(xpLevel);
      const lx = hx + 91 - (tw(lvStr) >> 1);
      const ly = barY - 6;
      txt(g, lvStr, lx + 1, ly, '#000000', false);
      txt(g, lvStr, lx - 1, ly, '#000000', false);
      txt(g, lvStr, lx, ly + 1, '#000000', false);
      txt(g, lvStr, lx, ly - 1, '#000000', false);
      txt(g, lvStr, lx, ly, '#80ff20', false);
    }
    _origDrawBars(g, hx, hy - 6);
  };

  // UI描画・Tick・3Dアニメーション・セーブ＆リセットへの統合
  const _origDrawUI = drawUI;
  drawUI = function() {
    _origDrawUI();
    if (!titleOn) {
      const g = $('ui').getContext('2d');
      drawChatUI(g);
    }
  };

  const _origDoTick5 = doTick;
  doTick = function() {
    _origDoTick5();
    xpOrbTick();
  };

  const _origAnimAll5 = animAll;
  animAll = function(al) {
    xpOrbMeshes(al);
    _origAnimAll5(al);
  };

  const _origResetPlayerState5 = resetPlayerState;
  resetPlayerState = function(mode) {
    xpLevel = 0;
    xpProgress = 0;
    for (const o of xpOrbs.splice(0)) {
      if (o.mesh) { scene.remove(o.mesh); o.mesh.geometry.dispose(); o.mesh.material.dispose(); }
    }
    _origResetPlayerState5(mode);
  };

  const _origSaveGame = saveGame;
  saveGame = function() {
    const ok = _origSaveGame();
    try {
      if (ok && curWorld) {
        const raw = localStorage.getItem(WK(curWorld.id));
        if (raw) {
          const data = JSON.parse(raw);
          data.xp = [xpLevel, xpProgress];
          localStorage.setItem(WK(curWorld.id), JSON.stringify(data));
        }
      }
    } catch (e) {}
    return ok;
  };

  const _origApplyPlayer = applyPlayer;
  applyPlayer = function(d) {
    _origApplyPlayer(d);
    if (d && Array.isArray(d.xp)) {
      xpLevel = d.xp[0] || 0;
      xpProgress = d.xp[1] || 0;
    }
  };
})();

</script></body></html>
